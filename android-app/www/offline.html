<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Muarakas</title>
<style>
  :root { --bg:#F2F5F4; --surface:#FFFFFF; --ink:#13201C; --muted:#5A6A65; --accent:#1D7781; --accent-ink:#FFFFFF; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0D1412; --surface:#151F1C; --ink:#E5EDEA; --muted:#93A39E; --accent:#3BB3AB; --accent-ink:#0D1412; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
         background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, -apple-system, Roboto, sans-serif; }
  main { max-width:340px; background:var(--surface); border-radius:16px; padding:28px 24px; text-align:center; }
  h1 { font-size:20px; margin:0 0 8px; }
  p { margin:0 0 20px; color:var(--muted); }
  button { width:100%; min-height:48px; border:0; border-radius:12px; background:var(--accent); color:var(--accent-ink);
           font:600 16px system-ui, -apple-system, Roboto, sans-serif; }
</style>
</head>
<body>
<main>
  <h1>Belum tersambung ke internet</h1>
  <p>Muarakas butuh internet saat dibuka pertama kali. Setelah itu aplikasinya tetap bisa dipakai tanpa sinyal.</p>
  <button type="button" id="retry">Coba lagi</button>
</main>
<script>
  var APP_URL = 'https://fatahilahuda.github.io/kas-keluarga/';
  function retry() { location.replace(APP_URL); }
  document.getElementById('retry').addEventListener('click', retry);
  window.addEventListener('online', retry);
</script>
</body>
</html>
