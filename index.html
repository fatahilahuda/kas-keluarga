<style>
/* Layout: a phone-first ledger. One centered column, sticky month bar on top, tab bar at the bottom, pockets as a swipeable strip. */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface-2:#E8EEEC; --ink:#13201C; --muted:#5A6A65; --line:#D6DFDC;
  --accent:#1D7781; --accent-ink:#FFFFFF; --accent-soft:#DDEFEE;
  --in:#167F55; --in-soft:#DBF1E6; --out:#BE3A30; --out-soft:#FBE3E0; --warn:#A86F12; --warn-soft:#FAEED6;
  --k0:#3A5BD9; --k1:#D08436; --k2:#22948A; --k3:#B04A88; --k4:#7564D4; --k5:#B8951C; --k6:#5A8A36; --k7:#8A9994;
  --tip-bg:#13201C; --tip-ink:#F2F5F4;
  --display:"Bricolage Grotesque", "Plus Jakarta Sans", system-ui, sans-serif;
  --body:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#151F1C; --surface-2:#1D2925; --ink:#E5EDEA; --muted:#93A39E; --line:#283632;
  --accent:#3BB3AB; --accent-ink:#0D1412; --accent-soft:#16312F;
  --in:#4CC48E; --in-soft:#15332A; --out:#F07B6F; --out-soft:#3A1E1B; --warn:#E3AE4D; --warn-soft:#352914;
  --k0:#7F96FF; --k1:#E9A866; --k2:#4FC1B4; --k3:#D97AB3; --k4:#A496F0; --k5:#E0C25A; --k6:#8DBE66; --k7:#6F7F7A;
  --tip-bg:#E5EDEA; --tip-ink:#0D1412;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#151F1C; --surface-2:#1D2925; --ink:#E5EDEA; --muted:#93A39E; --line:#283632;
  --accent:#3BB3AB; --accent-ink:#0D1412; --accent-soft:#16312F;
  --in:#4CC48E; --in-soft:#15332A; --out:#F07B6F; --out-soft:#3A1E1B; --warn:#E3AE4D; --warn-soft:#352914;
  --k0:#7F96FF; --k1:#E9A866; --k2:#4FC1B4; --k3:#D97AB3; --k4:#A496F0; --k5:#E0C25A; --k6:#8DBE66; --k7:#6F7F7A;
  --tip-bg:#E5EDEA; --tip-ink:#0D1412;
  color-scheme:dark; }

:root[data-skin="light"]{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface-2:#E8EEEC; --ink:#13201C; --muted:#5A6A65; --line:#D6DFDC;
  --accent:#1D7781; --accent-ink:#FFFFFF; --accent-soft:#DDEFEE;
  --in:#167F55; --in-soft:#DBF1E6; --out:#BE3A30; --out-soft:#FBE3E0; --warn:#A86F12; --warn-soft:#FAEED6;
  --k0:#3A5BD9; --k1:#D08436; --k2:#22948A; --k3:#B04A88; --k4:#7564D4; --k5:#B8951C; --k6:#5A8A36; --k7:#8A9994;
  --tip-bg:#13201C; --tip-ink:#F2F5F4; color-scheme:light; }
:root[data-skin="dark"]{
  --bg:#0D1412; --surface:#151F1C; --surface-2:#1D2925; --ink:#E5EDEA; --muted:#93A39E; --line:#283632;
  --accent:#3BB3AB; --accent-ink:#0D1412; --accent-soft:#16312F;
  --in:#4CC48E; --in-soft:#15332A; --out:#F07B6F; --out-soft:#3A1E1B; --warn:#E3AE4D; --warn-soft:#352914;
  --k0:#7F96FF; --k1:#E9A866; --k2:#4FC1B4; --k3:#D97AB3; --k4:#A496F0; --k5:#E0C25A; --k6:#8DBE66; --k7:#6F7F7A;
  --tip-bg:#E5EDEA; --tip-ink:#0D1412; color-scheme:dark; }
:root[data-skin="pink"]{
  --bg:#FFF0F5; --surface:#FFFFFF; --surface-2:#FCE3EC; --ink:#3B1527; --muted:#8C5A6F; --line:#F4C9D9;
  --accent:#D1236A; --accent-ink:#FFFFFF; --accent-soft:#FDDDEA;
  --in:#1E8659; --in-soft:#DDF3E8; --out:#C4381E; --out-soft:#FCE4DE; --warn:#B0701A; --warn-soft:#FBEED9;
  --k0:#E5679A; --k1:#EE8A5A; --k2:#2A9F97; --k3:#9A5BC4; --k4:#7C5CD6; --k5:#C29A22; --k6:#6AA14E; --k7:#B497A4;
  --tip-bg:#3B1527; --tip-ink:#FFF0F5; --hero-glow:#FF8FBA; color-scheme:light; }
/* kartu saldo pink: gradasi pink tua, bukan campuran teal */
:root[data-skin="pink"] .hero{background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--hero-glow) 55%,transparent),transparent 60%),linear-gradient(150deg,#D1236A,#A3185A);box-shadow:0 10px 30px color-mix(in srgb,#D1236A 32%,transparent)}
:root{--mk-teal:#1D7781;--mk-navy:#124E77;--mk-word:#144A73}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--mk-teal:#3BB3AB;--mk-navy:#4C8DD0;--mk-word:#E7EEF4}}
:root[data-theme="dark"],:root[data-skin="dark"]{--mk-teal:#3BB3AB;--mk-navy:#4C8DD0;--mk-word:#E7EEF4}
:root[data-skin="light"]{--mk-teal:#1D7781;--mk-navy:#124E77;--mk-word:#144A73}
:root[data-skin="pink"]{--mk-teal:#D1236A;--mk-navy:#8E1650;--mk-word:#6E1A40}
.mk .mk-s1{stop-color:var(--mk-teal)}.mk .mk-s2{stop-color:var(--mk-navy)}.mk .mk-band,.mk .mk-word2{fill:var(--mk-teal)}.mk .mk-word{fill:var(--mk-word)}
.brandmark{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0;padding:2px 0}
.brandmark .mk-h{width:34px;height:34px;flex:none}.brandmark .mk-h svg{width:34px;height:34px;display:block}
.brandmark .bw{display:block;flex:none}.brandmark .bw svg{height:21px;width:auto;display:block}
.top .ctx{order:3;flex:1 0 100%;min-width:0;max-width:100%;display:flex;gap:8px;align-items:stretch;margin-top:4px}
#modechip{display:flex;align-items:center;gap:10px;flex:1 1 auto;min-width:0;min-height:44px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 12px 0 10px;color:var(--ink);font-family:var(--body);font-weight:600;font-size:14px;white-space:nowrap}
#modechip:hover{background:var(--surface-2)}
#modechip .mi{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c,var(--accent)) 15%,transparent);color:var(--c,var(--accent))}
#modechip .mi svg{width:16px;height:16px}
#modechip .mn{overflow:hidden;text-overflow:ellipsis;min-width:0}
#modechip svg.chev{width:15px;height:15px;flex:none;color:var(--muted);margin-left:auto}
.top .ctx .month{flex:none}
.top .ctx .month .ib{width:38px;height:38px}
.top .ctx .month span{flex:none;min-width:76px;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.about{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 0 4px;text-align:center}
.about .mk{width:150px;height:auto}
.mk-lock{width:170px;margin:4px auto 2px}.mk-lock svg{width:100%;height:auto;display:block}
.skin-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.skin-pick button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.skin-pick button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.skin-pick i{width:34px;height:22px;border-radius:7px;border:1px solid rgba(0,0,0,.12);display:block}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:560px;margin:0 auto;padding-bottom:110px;overflow-x:clip}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:17px;font-weight:700}
p{margin:0}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding-block:10px 10px}
.top .month{justify-content:space-between}
.top .month span{flex:1}
.brand{font-family:var(--display);font-weight:700;font-size:17px;margin-right:auto;display:flex;align-items:center;gap:8px;white-space:nowrap;min-width:0}
.brand span{overflow:hidden;text-overflow:ellipsis}
button.brand{max-width:calc(100% - 96px);border:0;background:none;padding:4px 8px 4px 4px;border-radius:12px;color:var(--ink);font-size:15.5px}
button.brand:hover{background:var(--surface-2)}
.brand svg.chev{width:16px;height:16px;flex:none;color:var(--muted)}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;font-family:var(--body);flex:none}
.month{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.month span{min-width:104px;text-align:center;font-weight:600;font-size:14px}
.ib{width:36px;height:36px;border:0;background:transparent;border-radius:999px;display:grid;place-items:center;color:var(--ink);flex:none}
.ib:hover{background:var(--surface-2)}
.ib svg{width:20px;height:20px}

.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--in-soft);color:var(--in)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--out-soft);color:var(--out)} .pill.info{background:var(--accent-soft);color:var(--accent)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:14px}
.banner b{color:var(--accent)}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px}
.big{font-family:var(--display);font-weight:700;font-size:clamp(32px,9vw,42px);line-height:1.1;margin:4px 0 14px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.big.neg{color:var(--out)}
.io{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.io div{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;min-width:0}
.io b{display:block;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--c,var(--muted));flex:none}
.dot.in{background:var(--in)} .dot.out{background:var(--out)}
.meter{margin-top:14px}
.track{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;position:relative}
.fill{height:100%;border-radius:999px;background:var(--in);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.fill.warn{background:var(--warn)} .fill.bad{background:var(--out)}
.meter-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:13px;flex-wrap:wrap}

.pockets{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin-left:calc(-1 * max(16px, env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px, env(safe-area-inset-right,0px)));padding:2px max(16px, env(safe-area-inset-right,0px)) 6px max(16px, env(safe-area-inset-left,0px));scroll-padding-left:max(16px, env(safe-area-inset-left,0px));scrollbar-width:none}
.pockets::-webkit-scrollbar{display:none}
.pk{flex:0 0 158px;scroll-snap-align:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 10px;display:flex;flex-direction:column;gap:2px;min-width:0;transition:transform .15s ease,border-color .15s ease}
.pk:hover{border-color:var(--c)}
.pk:active{transform:scale(.97)}
.pk .pn{display:flex;align-items:center;gap:2px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden}
.pk .pn span:not(.dot){overflow:hidden;text-overflow:ellipsis}
.pk .pb{font-family:var(--display);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk .pb.neg{color:var(--out)}
.pk svg{width:100%;height:30px;display:block;margin:4px 0 2px}
.pk .pm{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk.add{align-items:center;justify-content:center;color:var(--accent);font-weight:600;border-style:dashed;flex-basis:120px;gap:6px}
.pk.add svg{width:24px;height:24px;margin:0}
.save-tag{font-size:9.5px;font-weight:700;letter-spacing:.05em;padding:1px 5px;border-radius:4px;background:var(--warn-soft);color:var(--warn);margin-left:4px;flex:none}

.cbar{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;width:100%;background:none;border:0;padding:5px 6px;margin:0 -6px;width:calc(100% + 12px);text-align:left;border-radius:8px}
.cbar:hover{background:var(--surface-2)}
.cbar + .cbar{margin-top:4px}
.cbar .lbl{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:4px}
.cbar .lbl span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbar .track{height:6px}
.cbar .amt{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;min-width:72px}
.mono{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;
  background:color-mix(in srgb, var(--c) 16%, transparent);color:var(--c)}
.mono svg{width:16px;height:16px}

.day{font-size:13px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;padding:14px 2px 6px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tx{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:transparent;border:0;padding:11px 14px;border-top:1px solid var(--line)}
.tx:first-child{border-top:0}
.tx:hover{background:var(--surface-2)}
.tx .d{min-width:0}
.tx .d b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .d small{color:var(--muted);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .d small b{display:inline;font-weight:600}
.tx .d small .dot{width:6px;height:6px;margin:0 4px 1px 0}
.tx .a{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.a.in{color:var(--in)} .a.tf{color:var(--muted)}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:17px;margin-bottom:4px}

.seg{display:grid;grid-auto-columns:1fr;grid-auto-flow:column;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:600;color:var(--muted);font-size:14px;transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button[aria-pressed="true"].o{color:var(--out)} .seg button[aria-pressed="true"].i{color:var(--in)} .seg button[aria-pressed="true"].t{color:var(--accent)}
.seg.sm{padding:3px;border-radius:10px} .seg.sm button{padding:5px 10px;font-size:12.5px;border-radius:7px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:13px;font-weight:600;color:var(--muted)}
.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;min-width:0}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp.amt{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;padding:10px 14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2>*{min-width:0}
.hint{font-size:12.5px;color:var(--muted);font-weight:400}
.err{font-size:13px;color:var(--out);font-weight:600}
.warnline{font-size:13px;color:var(--warn);font-weight:600;background:var(--warn-soft);border-radius:10px;padding:8px 10px}
.ai{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;background:var(--accent-soft);border-radius:10px;padding:8px 10px;min-height:38px}
.ai b{color:var(--accent)}
.ai svg{flex:none}
.ai>span{flex:1 1 180px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s,transform .1s}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.chip .tag{font-size:10px;font-weight:700;letter-spacing:.05em;padding:1px 5px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.chip[aria-pressed="true"] .tag{background:var(--accent-ink);color:var(--accent)}
.pchips{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pchip{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;min-width:0;transition:border-color .15s,box-shadow .15s,transform .1s}
.pchip:active{transform:scale(.97)}
.pchip span{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pchip[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 2px var(--c)}

.celeb{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px}
.celeb .cbg{position:absolute;inset:0;background:rgba(8,12,11,.62);animation:fadein .25s both}
.celeb canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.celeb .ccard{position:relative;z-index:1;width:min(340px,100%);background:var(--surface);color:var(--ink);border-radius:26px;padding:30px 20px 18px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;box-shadow:0 24px 70px rgba(0,0,0,.4),0 0 0 3px color-mix(in srgb,var(--tone) 55%,transparent);animation:celebIn .62s cubic-bezier(.3,1.55,.5,1) both;overflow:hidden}
.celeb .rays{position:absolute;left:50%;top:68px;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;background:repeating-conic-gradient(color-mix(in srgb,var(--tone) 26%,transparent) 0 9deg,transparent 9deg 18deg);-webkit-mask:radial-gradient(circle,#000 12%,transparent 60%);mask:radial-gradient(circle,#000 12%,transparent 60%);animation:spinr 10s linear infinite;pointer-events:none}
.celeb .cbadge{position:relative;width:80px;height:80px;border-radius:50%;background:var(--tone);color:#fff;display:grid;place-items:center;margin-bottom:6px;box-shadow:0 0 0 8px color-mix(in srgb,var(--tone) 24%,transparent),0 10px 24px color-mix(in srgb,var(--tone) 45%,transparent);animation:badgeIn .75s .08s cubic-bezier(.3,1.9,.5,1) both}
.celeb .cbadge svg{width:38px;height:38px}
.celeb .cbadge .bigav{font-family:var(--display);font-weight:700;font-size:38px;line-height:1}
.celeb .cbadge .bigemo{font-size:42px;line-height:1}
.celeb .eyebrow{position:relative;color:var(--tone);animation:fadein .4s .2s both}
.celeb .ctitle{position:relative;font-family:var(--display);font-weight:700;font-size:clamp(26px,8.4vw,36px);line-height:1.12;letter-spacing:-.02em;text-wrap:balance}
.celeb .ctitle .w{display:inline-block;white-space:nowrap}
.celeb .ctitle .ch{display:inline-block;animation:chIn .55s calc(.28s + var(--d) * 32ms) cubic-bezier(.3,1.9,.5,1) both}
.celeb .csub{position:relative;color:var(--muted);font-size:14.5px;animation:fadein .4s .55s both}
.celeb .cact{position:relative;display:flex;flex-direction:column;gap:8px;width:100%;margin-top:12px;animation:fadein .4s .6s both}
.celeb.win .cbadge{animation:badgeIn .75s .08s cubic-bezier(.3,1.9,.5,1) both,glow 1.6s 1s ease-in-out infinite}
.celeb.zonk .ccard{animation:celebIn .5s cubic-bezier(.3,1.4,.5,1) both,shake .45s .5s}
.celeb.zonk .rays{display:none}
.celeb.out .ccard{animation:celebOut .2s ease-in forwards}.celeb.out .cbg{animation:fadeout .2s forwards}.celeb.out canvas{display:none}
@keyframes celebIn{from{transform:scale(.35) rotate(-8deg);opacity:0}}
@keyframes celebOut{to{transform:scale(.85);opacity:0}}
@keyframes fadeout{to{opacity:0}}
@keyframes badgeIn{from{transform:scale(0) rotate(-120deg)}}
@keyframes chIn{from{transform:translateY(.7em) scale(.2) rotate(-18deg);opacity:0}}
@keyframes spinr{to{transform:rotate(360deg)}}
@keyframes glow{50%{transform:scale(1.07)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

.coin-stage{perspective:900px;height:190px;display:grid;place-items:center}
#coin-toss.toss{animation:toss 2.05s cubic-bezier(.3,0,.4,1)}
@keyframes toss{0%{transform:none}42%{transform:translateY(-92px) scale(1.18)}82%{transform:translateY(0) scale(1)}90%{transform:translateY(-12px)}100%{transform:none}}
.coin{width:124px;height:124px;position:relative;transform-style:preserve-3d;transition:transform 2s cubic-bezier(.2,.55,.25,1)}
.cf{position:absolute;inset:0;border-radius:50%;-webkit-backface-visibility:hidden;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:radial-gradient(circle at 34% 28%,#FFF4C4,#E9B840 52%,#A8770E);color:#5E4104;border:5px solid #C99520;box-shadow:inset 0 0 0 4px rgba(255,255,255,.35),inset 0 -8px 14px rgba(0,0,0,.22),0 8px 18px rgba(0,0,0,.2)}
.cf.b{transform:rotateY(180deg)}
.cf b{font-family:var(--display);font-size:38px;line-height:1}
.cf svg{width:44px;height:44px}
.cf small{font-size:10px;font-weight:700;letter-spacing:.14em}
.coin-sides{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:600}
.coin-sides span{display:inline-flex;align-items:center;gap:6px;min-width:0}
.coin-sides b{color:var(--muted);font-weight:600}

.suit-turn{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14.5px;text-align:left}
.suit-picks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.suit-picks button{border:1px solid var(--line);background:var(--surface-2);border-radius:16px;padding:14px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:13.5px;transition:transform .12s ease}
.suit-picks button span{font-size:40px;line-height:1.1}
.suit-picks button:active{transform:scale(.94)}
.suit-duel{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;justify-items:center;perspective:700px}
.scard{width:100px;height:124px;position:relative;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.scard .sf{position:absolute;inset:0;border-radius:16px;-webkit-backface-visibility:hidden;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:14px}
.scard .back{background:repeating-linear-gradient(45deg,var(--accent) 0 8px,color-mix(in srgb,var(--accent) 80%,#000) 8px 16px);color:var(--accent-ink);font-family:var(--display);font-size:40px}
.scard .front{background:var(--surface);border:2px solid var(--line);transform:rotateY(180deg)}
.scard .front span{font-size:46px;line-height:1.1}
.scard.open{transform:rotateY(180deg)}
.scard.win .front{border-color:var(--in);box-shadow:0 0 0 3px var(--in-soft)}
.suit-mid{font-family:var(--display);font-weight:700;font-size:22px;min-width:44px;text-align:center}
.suit-mid.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.suit-names{display:grid;grid-template-columns:1fr 1fr;text-align:center;font-size:13.5px;font-weight:600}
.suit-names span{display:inline-flex;gap:6px;align-items:center;justify-content:center}

.scratch{position:relative;height:150px;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,var(--k3),var(--k4));color:#fff;user-select:none;-webkit-user-select:none}
.sc-prize{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:12px}
.sc-prize .eyebrow{color:rgba(255,255,255,.8)}
.sc-prize b{font-family:var(--display);font-size:24px;line-height:1.15}
.sc-prize small{font-size:13px;opacity:.9}
.scratch.done .sc-prize b{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
#sc-cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;transition:opacity .35s}
#sc-cv.gone{opacity:0}

.gq{background:var(--surface-2);border-radius:14px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:2px}
.gq b{font-family:var(--display);font-size:20px;line-height:1.2}
.gq small{color:var(--muted)}
.gans{text-align:center}
.gans b{display:block;font-family:var(--display);font-size:34px;line-height:1.15;letter-spacing:-.02em}
.gans b.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1);color:var(--accent)}
.gres{display:grid;gap:8px}
.gres div{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.gres div span{display:flex;flex-direction:column;font-weight:600;min-width:0}
.gres small{color:var(--muted);font-weight:500;font-size:12.5px}
.gres div.win{border-color:var(--in);background:var(--in-soft)}
@media (prefers-reduced-motion:reduce){.coin,.scard{transition:none}}

.loanbox{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:13.5px}.loanbox .lr b{white-space:nowrap}.loanbox .lr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 0}.loanbox .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.loanbox .tiny{font-size:11.5px;line-height:1.4}

/* ===== v2 visual layer: icons first, one loud number per card, short copy ===== */
.ico{display:inline-grid;place-items:center;flex:none}
.ico svg{width:100%;height:100%}
.mono{width:38px;height:38px;border-radius:12px}
.mono svg{width:19px;height:19px}
.tx{grid-template-columns:38px 1fr auto}
.cbar{grid-template-columns:38px 1fr auto}
.tx .d b{font-size:15px}
.tx .a{font-size:15px}

/* section header: tinted icon tile + title */
.hh{display:flex;align-items:center;gap:10px;font-size:16.5px;min-width:0}
.hh .hi{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--accent)) 15%,transparent);color:var(--c,var(--accent));flex:none}
.hh .hi svg{width:17px;height:17px}

/* compact notices: icon, one bold line, one short line, one action */
.notes{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.note{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);width:100%;text-align:left;color:var(--ink);font-size:14px}
.notes .note{border:0;border-radius:0;border-top:1px solid var(--line)}
.notes .note:first-child{border-top:0}
.note .ni{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c,var(--accent)) 16%,transparent);color:var(--c,var(--accent))}
.note .ni svg{width:20px;height:20px}
.note .nt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.note .nt b{font-weight:700;font-size:14.5px}
.note .nt small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note .na{border:0;background:color-mix(in srgb,var(--c,var(--accent)) 16%,transparent);color:var(--c,var(--accent));font-weight:700;font-size:13px;padding:8px 12px;border-radius:999px;white-space:nowrap;flex:none}
.note .na.solid{background:var(--c,var(--accent));color:var(--accent-ink)}
.note .nchoice{display:flex;gap:6px;flex:none}
.note .nchoice button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 10px 5px 5px;font-weight:600;font-size:13px;display:inline-flex;align-items:center}
.note .nchoice .av{margin-right:5px;width:20px;height:20px;font-size:10px}
button.note{cursor:pointer}

/* hero: the one loud card */
.hero{position:relative;overflow:hidden;border:0;color:var(--accent-ink);
  background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--hero-glow,var(--mk-navy)) 55%,transparent),transparent 60%),linear-gradient(150deg,var(--accent),color-mix(in srgb,var(--accent) 70%,var(--k2)));
  box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 28%,transparent)}
.hero::after{content:"";position:absolute;right:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;border:28px solid color-mix(in srgb,var(--accent-ink) 7%,transparent);pointer-events:none}
.hero .eyebrow{color:inherit;opacity:.78}
.hero .big{margin:2px 0 14px}
.hero .big.neg{color:inherit}
.hero .io div{background:color-mix(in srgb,var(--accent-ink) 12%,transparent);display:flex;align-items:center;gap:10px;padding:10px}
.hero .io .ioi{width:32px;height:32px;border-radius:10px;background:var(--surface);display:grid;place-items:center;flex:none}
.hero .io .ioi svg{width:17px;height:17px}
.hero .io span{display:flex;flex-direction:column;min-width:0;font-size:12.5px;opacity:.85}
.hero .io b{font-size:15.5px;opacity:1}
.hero .track{background:color-mix(in srgb,var(--accent-ink) 18%,transparent)}
.hero .fill{background:var(--accent-ink)}
.hero .fill.warn{background:var(--warn)} .hero .fill.bad{background:var(--out)}
.hero .muted{color:inherit;opacity:.8}
.hero .pill{background:var(--surface);}
.hero .infobox{background:color-mix(in srgb,var(--accent-ink) 12%,transparent);color:inherit}
.hero .infobox .link{color:inherit;text-decoration:underline}
.hero .infobox b[style]{color:inherit!important}
.hero .loanbox{background:color-mix(in srgb,var(--accent-ink) 12%,transparent)}

/* quick actions */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink);padding:2px 0}
.qa button span{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--c);transition:transform .12s}
.qa button:active span{transform:scale(.92)}
.qa button svg{width:23px;height:23px}

/* pocket cards get an icon tile */
.pk .pt{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.pk .pt .ico{width:30px;height:30px;border-radius:10px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.pk .pt .ico svg{width:16px;height:16px}
.pk .pn{color:var(--muted)}

/* chips can carry a small icon */
.chip .ci{width:16px;height:16px;color:var(--cc,currentColor)}
.chip[aria-pressed="true"] .ci{color:inherit}
.chip .av{margin-right:0}

/* segmented tabs with icons (Kita) */
.seg.ic button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;font-size:12.5px;position:relative}
.seg.ic button svg{width:20px;height:20px}
.seg.ic .cnt{position:absolute;top:3px;left:calc(50% + 8px);min-width:17px;height:17px;border-radius:9px;background:var(--out);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px;line-height:1}

/* family */
.fam-head{display:flex;align-items:center;gap:12px}
.avs{display:flex;align-items:center}
.avs .av.lg{box-shadow:0 0 0 3px var(--surface)}
.avs .av.lg+.av.lg{margin-left:-10px}
.av.emo{background:color-mix(in srgb,var(--c) 22%,var(--surface));font-size:11px}
.av.lg.emo{font-size:19px}
.av.xl{width:64px;height:64px;font-size:26px;margin:0}
.av.xl.emo{font-size:34px}
.fstack{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--surface-2);gap:2px}
.fstack i{display:block;height:100%;background:var(--c)}
.prow2{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 2px;text-align:left}
.prow2:first-child{border-top:0}
.prow2 .pm2{min-width:0;display:flex;flex-direction:column;gap:5px}
.prow2 .pm2 b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow2 .pm2 small{color:var(--muted);font-size:12.5px}
.prow2 .track{height:6px}
.prow2 .amt2{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.prow2 .amt2 small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.fam-empty{text-align:center;padding:8px 6px 4px;display:flex;flex-direction:column;align-items:center;gap:8px}
.fam-empty .emo-row{font-size:34px;letter-spacing:4px}
.pick-emo{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.pick-emo button{border:1px solid var(--line);background:var(--surface);border-radius:12px;height:46px;font-size:24px;line-height:1}
.pick-emo button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.pbars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:96px}
.pbars div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.pbars i{display:block;width:100%;max-width:28px;border-radius:6px 6px 3px 3px;background:var(--c);min-height:3px;opacity:.45}
.pbars div.on i{opacity:1}
.pbars span{font-size:11px;color:var(--muted)}
.pbars div.on span{color:var(--ink);font-weight:700}
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat2>div{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.stat2 small{display:block;color:var(--muted);font-size:12.5px}
.stat2 b{font-size:16px;font-variant-numeric:tabular-nums}
.forline{display:inline-flex;align-items:center}
.forline .av{width:14px;height:14px;font-size:8px;margin-right:3px;vertical-align:0}

/* proposals: thumbnail + loud amount */
.prop-top{display:grid;grid-template-columns:46px 1fr;gap:12px;align-items:center}
.prop-top .mono{width:46px;height:46px;border-radius:14px}
.prop-top .mono svg{width:22px;height:22px}
.prop-top h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prop .who{font-size:12.5px;color:var(--muted);display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px}
.btns3 .btn,.btns .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn svg{width:18px;height:18px}

/* games: tile picker + full-screen stage */
.gtiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gtile{position:relative;overflow:hidden;border:0;border-radius:18px;padding:14px;min-height:118px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:10px;color:#fff;
  background:linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c) 62%,#000));transition:transform .12s}
.gtile:active{transform:scale(.97)}
.gtile .gi{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.22);display:grid;place-items:center}
.gtile .gi svg{width:24px;height:24px}
.gtile b{font-family:var(--display);font-size:17px;line-height:1.15;display:block}
.gtile small{font-size:12px;opacity:.85;display:block;line-height:1.3}
.gtile::after{content:"";position:absolute;right:-26px;top:-26px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.1)}
.gfs{position:fixed;inset:0;z-index:15;background:var(--bg);display:flex;flex-direction:column;animation:gfsIn .26s cubic-bezier(.2,.8,.2,1)}
@keyframes gfsIn{from{opacity:0;transform:translateY(24px)}}
.gfs-top{display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px))}
.gfs-top h2{flex:1;font-size:19px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gfs-top .ib{width:44px;height:44px;background:var(--surface);border:1px solid var(--line)}
.gfs-top .ib svg{width:22px;height:22px}
.gfs-body{flex:1;overflow:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.gfs-in{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:18px}
.gfs-in>.hint{text-align:center}
.gfs .wheel-wrap{width:min(86vw,58vh,420px)}
.gfs .die{width:96px;height:96px;border-radius:22px;padding:13px}
.gfs .coin{width:150px;height:150px}
.gfs .coin-stage{height:240px}
.gfs .scratch{height:200px}
.gfs .result{font-size:24px}
.gfs .btn.big{padding:16px;font-size:17px;border-radius:16px}
.wq{align-self:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px 8px 12px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:8px;max-width:100%}
.wq svg{width:16px;height:16px;color:var(--muted);flex:none}
.wq span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prelist{display:flex;flex-direction:column;gap:8px}
.prelist button{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:left;font-weight:600}
.prelist button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.prelist .mono{--c:var(--accent)}
.prelist small{display:block;color:var(--muted);font-weight:500;font-size:12.5px}
body.noscroll{overflow:hidden}
.gfs .result.has-win{min-height:0;font-family:var(--body);font-size:inherit;display:flex;flex-direction:column;gap:10px}

.gwin b .w{display:inline-block;white-space:nowrap}.gwin b .ch{display:inline-block;animation:chIn .45s calc(.1s + var(--d) * 22ms) cubic-bezier(.3,1.9,.5,1) both}
.gwin .gt>span{font-size:13.5px;color:var(--muted);font-weight:500}

.gwin-act{display:flex;flex-direction:column;gap:8px}

.gtile{box-shadow:0 5px 0 color-mix(in srgb,var(--c) 58%,#000),0 12px 22px color-mix(in srgb,var(--c) 28%,transparent),inset 0 1px 0 rgba(255,255,255,.28);margin-bottom:5px;transition:transform .12s,box-shadow .12s}

.dwho .dsum{margin-left:auto;font-family:var(--display);font-size:26px;line-height:1;color:var(--c)}
.dwho .dsum.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}

.d3{--s:70px;--db1:#FFFDF6;--db2:#E4D9C2;--dp:#1E2422;--dp2:#56605C;position:relative;width:var(--s);height:var(--s);perspective:560px;flex:none}

.dtilt{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(-17deg) rotateY(21deg)}
.cube{position:absolute;inset:0;transform-style:preserve-3d;transition:transform var(--dur,1.1s) cubic-bezier(.16,.74,.22,1)}
.cube .f{position:absolute;inset:0;border-radius:22%;background:radial-gradient(circle at 30% 24%,#fff 0,var(--db1) 42%,var(--db2) 100%);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:12%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.07),inset 0 -6px 10px rgba(0,0,0,.16),inset 0 4px 6px rgba(255,255,255,.55);-webkit-backface-visibility:hidden;backface-visibility:hidden}
.cube .f i{border-radius:50%;margin:13%}

.cube .f1 i.on{--dp:#C32B30;--dp2:#E8585C}

.cube .f1{transform:translateZ(calc(var(--s) / 2))}
.cube .f6{transform:rotateY(180deg) translateZ(calc(var(--s) / 2))}
.cube .f3{transform:rotateY(90deg) translateZ(calc(var(--s) / 2))}
.cube .f4{transform:rotateY(-90deg) translateZ(calc(var(--s) / 2))}
.cube .f2{transform:rotateX(90deg) translateZ(calc(var(--s) / 2))}
.cube .f5{transform:rotateX(-90deg) translateZ(calc(var(--s) / 2))}
.cube .core{position:absolute;inset:2%;border-radius:14%;background:var(--db2)}
.cube .core.c2{transform:rotateY(90deg)}.cube .core.c3{transform:rotateX(90deg)}
.d3.toss .dtilt{animation:dtoss var(--dur,1.1s) cubic-bezier(.3,0,.3,1)}

function parseAmount(str){
  const re=/(\d+(?:[.,]\d+)*)\s*(rb|ribu|k|jt|juta)?(?![a-z0-9])/gi;let m,best=null;

    if(suf){const mult=(suf==='jt'||suf==='juta')?1e6:1e3;val=/^\d+[.,]\d{1,2}$/.test(raw)?parseFloat(raw.replace(',','.'))*mult:parseInt(raw.replace(/[.,]/g,''),10)*mult;}
    else{val=/^\d+,\d{1,2}$/.test(raw)?parseInt(raw,10):parseInt(raw.replace(/[.,]/g,''),10);if(val>0&&val<1000)val*=1000;}

}

  const dx=[],m=[],t=[];for(let k=0;k<n-1;k++){dx[k]=pts[k+1][0]-pts[k][0];m[k]=dx[k]?(pts[k+1][1]-pts[k][1])/dx[k]:0;}

  for(let k=1;k<n-1;k++){t[k]=m[k-1]*m[k]<=0?0:3*(dx[k-1]+dx[k])/((2*dx[k]+dx[k-1])/m[k-1]+(dx[k]+2*dx[k-1])/m[k]);}

function refreshForm(){
  const d=document.getElementById('fdesc');if(!d)return;
  if(BOOKT[F.type]){bookRefresh();return;}
  F._amt=amountFromField(document.getElementById('famt').value);
  if(F.type!=='tf'){
    if(!F.bizManual&&!MODE()){const g=bizGuess(d.value);if(g!==F.biz){F.biz=g;F.cat=F.catManual?F.cat:null;}F.bizAuto=!!g;}
    const cty=F.biz?(F.type==='in'?'bin':'bout'):F.type;
    if(F.cat&&!CATS[cty].some(c=>c.id===F.cat)){F.cat=null;F.catManual=false;}
    F.ai=predict(cty,d.value+(F.scan&&F.scan.words?' '+F.scan.words:''));if(!F.catManual)F.cat=F.ai.conf>0?F.ai.best:(F.cat||null);if(!F.pocketManual)F.pocket=defaultPocket(cty,F.cat||'lain',F.biz);
    if(F.type==='in'&&!F.hiddenManual)F.hidden=defaultHidden();
    if(F.type==='out'&&!F.forManual)F.forId=F.biz?null:guessFor(d.value);}
  else{if(!F.pocket)F.pocket=defaultPocket('out','lain');if(!F.to||F.to===F.pocket){const sv=activePockets().find(p=>p.save&&p.id!==F.pocket)||activePockets().find(p=>p.id!==F.pocket);F.to=sv?sv.id:null;}}
  const tmp=document.createElement('div');tmp.innerHTML=vAdd();
  ['fbiz','fai','fcats','fpk','ffrom','fto','fwarn','ftab','fhide','ffor'].forEach(id=>{const a=document.getElementById(id),b=tmp.querySelector('#'+id);if(a&&b)a.innerHTML=b.innerHTML;});
  const fw=document.getElementById('fforw'),fw2=tmp.querySelector('#fforw');if(fw&&fw2)fw.hidden=fw2.hidden;
}

function showErr(m){const e=document.getElementById('ferr');e.textContent=m;e.hidden=false;}
function saveForm(){
  if(BOOKT[F.type]){saveBookForm();return;}
  const d=document.getElementById('fdesc'),a=document.getElementById('famt'),dt=document.getElementById('fdate');
  const raw=d.value.trim();let amount=amountFromField(a.value);if(!amount){const p=parseAmount(raw);amount=p?p.val:0;}
  if(!amount){showErr('Isi nominalnya, misal 15000 atau 15rb.');a.focus();return;}
  let desc=raw;const pp=parseAmount(raw);if(pp&&pp.val===amount)desc=(raw.slice(0,pp.start)+raw.slice(pp.start+pp.len)).replace(/\s+/g,' ').trim();
  const now=Date.now(),date=dt.value||todayISO();
  if(F.type==='tf'){
    if(!F.pocket||!F.to){showErr('Pilih kantong asal dan tujuan.');return;}
    if(F.pocket===F.to){showErr('Kantong asal dan tujuan harus berbeda.');return;}
    desc=desc?desc.charAt(0).toUpperCase()+desc.slice(1):'Pindah ke '+pname(F.to);
    S.tx.push({id:uid(),type:'tf',amount,desc,cat:'tf',pocket:F.pocket,to:F.to,date,ts:now,u:now,by:S.me});save();
    toast(fmtS(amount)+' dipindah ke '+pname(F.to));
  }else{
    if(!F.pocket){showErr('Pilih kantongnya dulu. Tambah kantong lewat Pengaturan.');return;}
    const cty=F.biz?(F.type==='in'?'bin':'bout'):F.type;
    const c=F.cat||predict(cty,desc).best,ai=predict(cty,desc),corrected=ai.conf>0&&ai.best!==c;
    desc=desc?desc.charAt(0).toUpperCase()+desc.slice(1):cat(cty,c).n;
    const tx={id:uid(),type:F.type,amount,desc,cat:c,pocket:F.pocket,date,ts:now,u:now};if(F.biz)tx.biz=F.biz;else if(F.type==='out'&&F.forId&&person(F.forId))tx.for=F.forId;tx.by=S.me;
    if(F.type==='out'&&!F.biz&&F.forManual)String(desc).toLowerCase().replace(/[^a-z\s]/g,' ').split(/\s+/).filter(w=>w.length>=4&&!STOP[w]&&!GENERIC[w]&&!SEED.out.lain.includes(w)).forEach(w=>{S.forWords[w]=F.forId||'_';});if(F.type==='in'&&F.hidden)tx.hidden=true;S.tx.push(tx);
    if(F.scan&&F.scan.photo&&!F.scan.busy){try{localStorage.setItem('kas.ph.'+tx.id,F.scan.photo);}catch(e){}}
    const guess=bizGuess(desc);String(desc).toLowerCase().replace(/[^a-z\s]/g,' ').split(/\s+/).filter(w=>w.length>=4&&!GENERIC[w]&&!STOP[w]).forEach(w=>{if(F.biz)S.bizWords[w]=F.biz;else if(guess&&F.bizManual)S.bizWords[w]='home';});
    learn(cty,desc,c,F.pocket);save();
    if(tx.hidden){toast('Tersimpan sebagai rahasia. '+partner().n+' akan melihatnya sebagai kado tertutup.');if(S.family&&!SECKEY)setTimeout(pinSheet,350);}else toast((F.biz?bname(F.biz)+' · ':'')+(corrected?'AI belajar: "'+desc+'" → '+cat(cty,c).n:'Tersimpan di '+cat(cty,c).n+' · '+pname(F.pocket)));
  }
  F=newForm(F.type,{date});if(mkey(date)!==CUR)CUR=mkey(date);
  render();const nd=document.getElementById('fdesc');if(nd)nd.focus();
}

function rules(t){
  let need=0,want=0,sav=0;Object.keys(t.cats).forEach(k=>{const g=cat('out',k).g;if(g==='need')need+=t.cats[k];else if(g==='save')sav+=t.cats[k];else want+=t.cats[k];});
  const base=t.hin+Math.max(0,t.bizNet||0);return {need,want,save:sav+Math.max(0,base-t.hout),base};
}
function ruleRow(label,v,inc,target,kind){

  return '<div class="rule"><div class="top2"><span>'+label+' <span class="pill '+(ok?'good':cls)+'" style="margin-left:4px">'+(ok?'Pas':kind==='max'?'Lebih':'Kurang')+'</span></span><span class="num"><b>'+Math.round(p)+'%</b> <span class="muted">/ '+target+'%</span></span></div>'+
    '<div class="track"><div class="fill '+cls+'" style="width:'+Math.min(100,p)+'%"></div><span class="mark" style="left:calc('+target+'% - 1px)"></span></div></div>';
}

  Object.keys(S.deleted).forEach(id=>{const u=S.deleted[id];if(dirty('del',id,u))items.push({kind:'del',id,u,data:{ts:u}});});
  for(let i=0;i<items.length;i+=400){const ch=items.slice(i,i+400);await rpc('kas_push',{p_code:S.family.code,p_items:ch});ch.forEach(x=>{S.srvU[x.kind+':'+x.id]=x.u;});persist();}

const isIOSBrowser=()=>/iPhone|iPad|iPod/.test(navigator.userAgent)&&!navigator.standalone&&!(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
async function joinFamily(c){
  if(S.family)return S.family.code===c?'same':'other';
  if(!await rpc('kas_exists',{p_code:c}))return 'notfound';
  clearSamplesData();S.family={code:c,rev:0};S.srvU={};save();await syncNow();return 'ok';}
async function joinAndReport(c){
  try{const r=await joinFamily(c);
    if(r==='same'){closeSheet();toast('HP ini sudah tersambung ke keluarga ini.');return true;}
    if(r==='other'){closeSheet();toast('HP ini sudah tersambung ke keluarga lain. Putuskan dulu di Pengaturan kalau mau pindah.');return true;}
    if(r==='notfound'){toast('Kode tidak ditemukan. Minta '+partner().n+' membuka undangan lagi.');return false;}
    settingsSheet();render(true);toast('Tersambung! Pilih dulu HP ini milik siapa.');return true;}
  catch(e){toast('Tidak bisa terhubung ke server. Periksa internetmu lalu coba lagi.');return false;}}

function inviteSheet(){const c=S.family.code,pn=esc(partner().n);

    '<div class="qrwrap">'+qrSVG(inviteURL(c))+'</div>'+
    '<p class="small muted center">Di HP '+pn+', buka Muarakas lalu Pengaturan → <b>Pindai QR</b>. Kamera HP biasa juga bisa.</p>'+
    '<div class="codebox"><b>'+fmtCode(c)+'</b><button class="link" data-act="fam-copy">Salin</button></div>'+
    '<div id="nfcbox" class="stack"></div>'+
    '<button class="btn ghost" data-act="fam-link">'+ic('link')+'Kirim tautan undangan</button>'+
    '<p class="hint">Berikan hanya ke pasangan. Siapa pun yang punya kode ini bisa melihat catatan publik keluarga.</p></div>');
  nfcBox();}
function inviteLinkSheet(c){
  if(!onlineOK())return;

  openSheet(sheetHead('Gabung ke keluarga?')+'<div class="stack"><p class="small muted">Kamu diundang memakai Muarakas bersama. Setelah bergabung, catatan di HP ini ikut tersinkron ke keluarga itu dan data contoh dihapus.</p>'+

    (isIOSBrowser()?'<p class="hint">Muarakas sudah ada di layar utama? Buka dari sana, lalu Pengaturan → Gabung dengan kode, dan tempel kode ini.</p>':'')+

function loadScript(u){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.async=true;s.onload=res;s.onerror=()=>{s.remove();rej(new Error('net'));};document.head.appendChild(s);});}
function qrDetector(){if(QRDET)return QRDET;

    if('BarcodeDetector' in window){try{if((await BarcodeDetector.getSupportedFormats()).includes('qr_code')){const bd=new BarcodeDetector({formats:['qr_code']});return async src=>{const r=await bd.detect(src);return r.length?r[0].rawValue:null;};}}catch(e){}}

    return async(src,photo)=>{const w=src.videoWidth||src.naturalWidth||src.width,h=src.videoHeight||src.naturalHeight||src.height;if(!w||!h)return null;
      const k=Math.min(1,(photo?1400:720)/Math.max(w,h));cv.width=Math.round(w*k);cv.height=Math.round(h*k);cx.drawImage(src,0,0,cv.width,cv.height);

async function startCam(){const v=document.getElementById('qrv');if(!v||SCAN.stream)return;

  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){qrMsg('Kamera tidak tersedia di sini. Pakai foto kode QR di bawah.');return;}
  try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});

  catch(e){stopCam();qrMsg(e&&e.name==='NotAllowedError'?'Izin kamera ditolak. Izinkan kamera di pengaturan HP, atau pakai foto kode QR di bawah.':'Kamera tidak bisa dibuka. Pakai foto kode QR di bawah.');return;}

/* secret amounts are encrypted on the owner's phone (PBKDF2 PIN -> AES-GCM) before they go online */
const b64=buf=>{let s='';new Uint8Array(buf).forEach(c=>s+=String.fromCharCode(c));return btoa(s);};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let SECKEY=null;
async function loadKey(){SECKEY=null;try{const r=localStorage.getItem('kas.seckey.'+S.me);if(r&&crypto.subtle)SECKEY=await crypto.subtle.importKey('raw',unb64(r),'AES-GCM',true,['encrypt','decrypt']);}catch(e){SECKEY=null;}}
async function deriveKey(pin,salt){const e=new TextEncoder(),base=await crypto.subtle.importKey('raw',e.encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:e.encode(salt),iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['encrypt','decrypt']);}
async function encStr(key,str){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(str));return b64(iv)+'.'+b64(ct);}
async function decStr(key,str){const p=str.split('.'),pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(p[0])},key,unb64(p[1]));return new TextDecoder().decode(pt);}
async function setPin(pin){
  const m=me();if(!m.salt){m.salt=uid()+uid();}const key=await deriveKey(pin,m.salt);
  if(m.pinCheck){let ok=false;try{ok=(await decStr(key,m.pinCheck))==='ok';}catch(e){}if(!ok)throw new Error('pin');}
  else{m.pinCheck=await encStr(key,'ok');m.u=Date.now();}
  SECKEY=key;try{localStorage.setItem('kas.seckey.'+S.me,b64(await crypto.subtle.exportKey('raw',key)));}catch(e){}
  save();await unlockOwnSealed();
}
async function unlockOwnSealed(){if(!SECKEY)return 0;let n=0;for(const t of S.tx){if(t.sealed&&t.enc&&t.by===S.me){try{const full=JSON.parse(await decStr(SECKEY,t.enc));Object.keys(t).forEach(k=>delete t[k]);Object.assign(t,full);n++;}catch(e){}}}if(n){save();render();}return n;}

function confettiRain(cv,amt){
  const dpr=Math.min(2,window.devicePixelRatio||1),W=innerWidth,H=innerHeight,x=cv.getContext('2d');cv.width=W*dpr;cv.height=H*dpr;x.scale(dpr,dpr);

    if(!wave&&el>26){wave=true;add(W/2,H*.32,-Math.PI/2,v*.62,90,Math.PI*2);}

      x.save();x.translate(p.x+Math.sin(p.t)*1.5,p.y);x.rotate(p.r);x.scale(1,Math.cos(p.t*1.3));x.fillStyle=p.c;
      if(p.sh===1){x.beginPath();x.arc(0,0,p.w/2,0,7);x.fill();}else if(p.sh===2){x.beginPath();for(let k=0;k<5;k++){const aa=k*1.2566-1.5708;x.lineTo(Math.cos(aa)*p.w*.8,Math.sin(aa)*p.w*.8);x.lineTo(Math.cos(aa+.6283)*p.w*.33,Math.sin(aa+.6283)*p.w*.33);}x.fill();}

const stkBest=()=>{try{return +localStorage.getItem('kas.stkbest')||0;}catch(e){return 0;}};
function stkBtnLabel(){const st=UI.stk,m=S.members;if(st.sc[0]!=null&&st.sc[1]!=null)return 'Main lagi';return 'Mulai: giliran '+esc(m[st.turn].n);}
function stkBoard(){const st=UI.stk,m=S.members;return '<div class="stk-board" id="stk-board">'+[0,1].map(i=>'<div class="'+(st.turn===i&&st.sc[i]==null?'on':'')+'" style="--c:'+memTone(m[i])+'">'+av(m[i].id)+'<span>'+esc(m[i].n)+'</span><b class="num">'+(st.sc[i]==null?'–':st.sc[i])+'</b></div>').join('')+'</div>';}
function stackBody(){
  const st=UI.stk||(UI.stk={turn:0,sc:[null,null]}),b=stkBest();
  return '<p class="hint">Ketuk arena untuk menjatuhkan koin. Makin pas di tengah, makin kokoh. Gantian, tumpukan tertinggi menang.</p>'+
    stkBoard()+
    '<div class="stk-wrap" id="stk-wrap"><canvas id="stk-cv" aria-hidden="true"></canvas><div class="stk-hud" aria-live="polite"><b class="num" id="stk-n">0</b><small id="stk-msg">'+(b?'Rekor: '+b+' koin':'Siap menumpuk?')+'</small></div></div>'+
    '<button class="btn big" data-act="stkgo" id="stk-go">'+stkBtnLabel()+'</button>';
}
function initStack(){
  const cv=document.getElementById('stk-cv');if(!cv||cv.dataset.on)return;cv.dataset.on='1';
  const wrap=cv.parentNode,dpr=Math.min(2,window.devicePixelRatio||1),W=wrap.clientWidth,H=wrap.clientHeight,x=cv.getContext('2d');cv.width=W*dpr;cv.height=H*dpr;x.scale(dpr,dpr);
  const R=Math.min(W*.19,60);
  STK={cv,x,W,H,R,RY:R*.34,T:Math.max(8,Math.round(R*.17)),baseY:H-48,stack:[{x:0}],mov:null,drop:null,fall:[],fx:[],cam:0,camT:0,run:false,loop:false,last:0,phase:0};
  wrap.addEventListener('pointerdown',e=>{if(STK&&STK.run&&!STK.drop){e.preventDefault();stkDrop();}});
  stkDraw();
}
function stkStart(){
  const g=STK;if(!g)return;SFX.unlock();clearWin();Object.assign(g,{stack:[{x:0}],drop:null,fall:[],fx:[],cam:0,camT:0,run:true});UI.stacking=true;
  stkSpawn();const b=document.getElementById('stk-go');if(b){b.disabled=true;b.textContent='Ketuk arena untuk menjatuhkan';}
  document.getElementById('stk-n').textContent='0';document.getElementById('stk-msg').textContent='Giliran '+S.members[UI.stk.turn].n;stkLoop();
}
function stkSpawn(){const g=STK,n=g.stack.length;g.phase=Math.random()<.5?-Math.PI/2:Math.PI/2;g.mov={spd:Math.min(4.6,1.9+.11*(n-1))};}
function stkDrop(){const g=STK,top=g.stack.length;g.drop={x:stkMovX(),y:g.baseY-top*g.T-78,vy:0,ty:g.baseY-top*g.T};g.mov=null;buzz(8);}
const stkMovX=()=>(STK.W/2-STK.R-6)*Math.sin(STK.phase);
function stkLand(){
  const g=STK,d=g.drop,top=g.stack[g.stack.length-1],dx=d.x-top.x,msg=document.getElementById('stk-msg');g.drop=null;
  if(Math.abs(dx)>g.R*.92){g.fall.push({x:d.x,y:d.y,vx:Math.sign(dx)*110,vy:-60,rot:0,vr:Math.sign(dx)*3.2});stkOver('Meleset!');return;}
  let px=d.x;if(Math.abs(dx)<g.R*.09){px=top.x;g.fx.push({x:px,lv:g.stack.length,t:0});SFX.play('lock');buzz([10,30,10]);if(msg)msg.textContent='Pas!';}
  else{SFX.play('clink');buzz(12);if(msg)msg.textContent=Math.abs(dx)>g.R*.6?'Hampir jatuh…':'Lanjut!';}
  g.stack.push({x:px});
  /* A coin stays put only while the centre of mass of everything above it rests over the coin below. */
  for(let k=1;k<g.stack.length;k++){let s=0;for(let j=k;j<g.stack.length;j++)s+=g.stack[j].x;const com=s/(g.stack.length-k),under=g.stack[k-1].x;
    if(Math.abs(com-under)>g.R*.96){const dir=Math.sign(com-under);g.stack.slice(k).forEach((c,j)=>g.fall.push({x:c.x,y:g.baseY-(k+j)*g.T,vx:dir*(70+j*16),vy:-30,rot:0,vr:dir*(1.6+j*.25)}));g.stack.length=k;stkOver('Tumpukannya roboh!');return;}}
  document.getElementById('stk-n').textContent=g.stack.length-1;g.camT=Math.max(0,g.stack.length*g.T-g.H*.42);stkSpawn();
}
function stkOver(why){
  const g=STK;g.run=false;g.mov=null;UI.stacking=false;SFX.play('fall');buzz([40,30,80]);
  const sc=g.stack.length-1,st=UI.stk,m=S.members,msg=document.getElementById('stk-msg'),n=document.getElementById('stk-n');if(n)n.textContent=sc;if(msg)msg.textContent=why+' '+sc+' koin.';
  setTimeout(()=>{if(!document.getElementById('stk-go'))return;st.sc[st.turn]=sc;if(sc>stkBest())try{localStorage.setItem('kas.stkbest',String(sc));}catch(e){}
    const done=st.sc[0]!=null&&st.sc[1]!=null;if(!done)st.turn=1;
    const bd=document.getElementById('stk-board');if(bd)bd.outerHTML=stkBoard();
    const b=document.getElementById('stk-go');b.disabled=false;b.textContent=stkBtnLabel();
    if(!done){if(msg)msg.textContent=m[0].n+' dapat '+sc+' koin. Oper HP ke '+m[1].n+'.';return;}
    const a=st.sc[0],c=st.sc[1],w=a===c?null:a>c?m[0]:m[1];
    if(!w)celebrate({eyebrow:'Tumpuk koin',title:'Seri!',sub:'Sama-sama '+a+' koin. Tanding ulang?',tone:'var(--warn)',icon:GICON.equal,sound:'draw',actions:[['Main lagi','stkgo']]});
    else celebrate({eyebrow:'Tumpuk koin',title:w.n+' menang!',sub:Math.max(a,c)+' koin lawan '+Math.min(a,c)+' koin. Paling rajin menabung!',tone:memTone(w),icon:memBadge(w),actions:[['Main lagi','stkgo','ghost']]});
  },RM?0:900);
}
function stkLoop(){const g=STK;if(!g||g.loop)return;g.loop=true;g.last=performance.now();
  const step=now=>{if(!STK||STK!==g||!g.cv.isConnected){g.loop=false;return;}const dt=Math.min(.04,(now-g.last)/1000);g.last=now;
    if(g.mov)g.phase+=g.mov.spd*dt;
    if(g.drop){g.drop.vy+=2600*dt;g.drop.y+=g.drop.vy*dt;if(g.drop.y>=g.drop.ty){g.drop.y=g.drop.ty;stkLand();}}
    g.fall.forEach(f=>{f.vy+=1500*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.rot+=f.vr*dt;});g.fall=g.fall.filter(f=>f.y+g.cam<g.H+120);
    g.fx.forEach(f=>f.t+=dt);g.fx=g.fx.filter(f=>f.t<.6);g.cam+=(g.camT-g.cam)*Math.min(1,dt*6);
    stkDraw();if(g.run||g.drop||g.fall.length||g.fx.length||Math.abs(g.camT-g.cam)>.5)requestAnimationFrame(step);else g.loop=false;};
  requestAnimationFrame(step);}
function stkCoin(x,cx,sy,R,RY,T,face){
  const sd=x.createLinearGradient(cx-R,0,cx+R,0);sd.addColorStop(0,'#6E4805');sd.addColorStop(.28,'#D3A02A');sd.addColorStop(.5,'#F7D774');sd.addColorStop(.74,'#C38E16');sd.addColorStop(1,'#6E4805');
  x.beginPath();x.moveTo(cx-R,sy);x.lineTo(cx-R,sy+T);x.ellipse(cx,sy+T,R,RY,0,Math.PI,0,true);x.lineTo(cx+R,sy);x.ellipse(cx,sy,R,RY,0,0,Math.PI,false);x.fillStyle=sd;x.fill();
  x.strokeStyle='rgba(90,58,0,.32)';x.lineWidth=1;x.beginPath();for(let k=1;k<12;k++){const px=cx-R+2*R*k/12,yy=sy+RY*Math.sqrt(Math.max(0,1-Math.pow((px-cx)/R,2)));x.moveTo(px,yy+1);x.lineTo(px,yy+T-1);}x.stroke();
  const tp=x.createRadialGradient(cx-R*.32,sy-RY*.5,R*.05,cx,sy,R*1.15);tp.addColorStop(0,'#FFF6CF');tp.addColorStop(.38,'#F2C94C');tp.addColorStop(.78,'#D9A21F');tp.addColorStop(1,'#A9740B');
  x.beginPath();x.ellipse(cx,sy,R,RY,0,0,Math.PI*2);x.fillStyle=tp;x.fill();x.strokeStyle='rgba(122,86,10,.5)';x.lineWidth=1.3;x.beginPath();x.ellipse(cx,sy,R*.8,RY*.8,0,0,Math.PI*2);x.stroke();
  if(face){x.save();x.translate(cx,sy);x.scale(1,RY/R);x.font='700 '+Math.round(R*.52)+'px "Bricolage Grotesque",system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';
    x.fillStyle='rgba(255,255,255,.45)';x.fillText('500',0,2);x.fillStyle='rgba(110,72,5,.72)';x.fillText('500',0,0);x.restore();}
}
function stkDraw(){
  const g=STK;if(!g)return;const {x,W,H,R,RY,T}=g,cx=W/2,cam=g.cam;x.clearRect(0,0,W,H);
  const fy=g.baseY+T+cam;if(fy<H+40){x.beginPath();x.ellipse(cx,fy+3,R*1.55,RY*1.5,0,0,Math.PI*2);x.fillStyle='rgba(0,0,0,.13)';x.fill();}
  const lo=Math.max(0,Math.floor((cam-(H-g.baseY)-T*4)/T));
  for(let i=lo;i<g.stack.length;i++){const sy=g.baseY-i*T+cam;if(sy>H+T)continue;stkCoin(x,cx+g.stack[i].x,sy,R,RY,T,i===g.stack.length-1);}
  g.fx.forEach(f=>{const sy=g.baseY-(f.lv)*T+cam,k=f.t/.6;x.beginPath();x.ellipse(cx+f.x,sy,R*(1+k*.7),RY*(1+k*.7),0,0,Math.PI*2);x.strokeStyle='rgba(255,214,90,'+(1-k)+')';x.lineWidth=3;x.stroke();});
  g.fall.forEach(f=>{x.save();x.translate(cx+f.x,f.y+cam+T/2);x.rotate(f.rot);stkCoin(x,0,-T/2,R,RY,T,false);x.restore();});
  const top=g.baseY-g.stack.length*g.T;
  if(g.mov){const sy=top-78+cam,mx=cx+stkMovX();x.beginPath();x.ellipse(mx,top+cam,R*.7,RY*.6,0,0,Math.PI*2);x.fillStyle='rgba(0,0,0,.08)';x.fill();stkCoin(x,mx,sy,R,RY,T,true);}
  if(g.drop)stkCoin(x,cx+g.drop.x,g.drop.y+cam,R,RY,T,true);
}

/* Games run in a full-screen stage over the app. Only paintGame() repaints it, so background syncs never interrupt a spin. */
const GDEF={
  wheel:{n:'Roda putar',ic:'wheel',k:0,tag:'Biar adil, serahkan ke roda'},
  dice:{n:'Duel dadu',ic:'dice',k:1,tag:'Angka tertinggi menang'},
  coin:{n:'Lempar koin',ic:'coin',k:5,tag:'Angka atau gambar'},
  suit:{n:'Suit',ic:'hand',k:2,tag:'Gajah, orang, semut'},
  scratch:{n:'Kartu gosok',ic:'ticket',k:3,tag:'Hadiah kecil, wajib ditepati'},
  guess:{n:'Tebak harga',ic:'tag',k:4,tag:'Dari pengeluaran kalian'},
  stack:{n:'Tumpuk koin',ic:'stack',k:6,tag:'Baru! Siapa paling tinggi'}};
function gameMount(){if(!UI.gfs)return;if(UI.game==='scratch')initScratch();if(UI.game==='stack'){STK=null;initStack();}}
function gameBody(k){
  const m1=S.members[0],m2=S.members[1];
  if(k==='dice')return '<p class="hint">Masing-masing dua dadu. Jumlah tertinggi menang. Dapat kembar? Nilainya dikali dua.</p><div class="duel">'+diceSide(0)+'<span class="vs">VS</span>'+diceSide(1)+'</div><div class="result" id="dice-res" aria-live="polite"></div><button class="btn big" data-act="roll">Lempar dadu</button>';
  if(k==='coin'){const sw=!!UI.coinSwap,ka=sw?m2:m1,kb=sw?m1:m2;
    return '<div class="coin-stage"><span class="cshadow"></span><div id="coin-toss"><div class="ctilt"><div class="coin" id="coin" style="transform:rotateX('+(UI.coinRot||0)+'deg)">'+coinBody()+'</div></div></div></div>'+
      '<div class="coin-sides"><span>'+av(ka.id)+esc(ka.n)+' <b>Angka</b></span><button class="swapbtn" data-act="coinswap" aria-label="Tukar sisi koin">'+GICON.swap+'Tukar</button><span><b>Gambar</b> '+esc(kb.n)+av(kb.id)+'</span></div><div class="result" id="coin-res" aria-live="polite"></div><button class="btn big" data-act="coin">Lempar koin</button>';}
  if(k==='stack')return stackBody();
  if(k==='suit')return '<p class="hint">Gajah injak orang, orang injak semut, semut masuk telinga gajah. Gantian pilih, HP dioper.</p><div id="suit-stage" class="stack">'+suitStage()+'</div>';
  if(k==='scratch')return '<p class="hint">Gosok sampai kelihatan.</p>'+scratchCard();
  if(k==='guess')return '<div id="guess-box" class="stack">'+guessCard()+'</div>';
  const opts=wheelOptions();
  return '<button class="wq" data-act="wedit">'+ic('edit')+'<span>'+esc(WHEEL_PRESETS[S.wheel.preset][0])+'</span></button>'+
    '<div class="wheel-wrap"><svg class="wheel-pin" viewBox="0 0 30 38" aria-hidden="true"><defs><linearGradient id="wg-pin" x1="0" x2="1"><stop offset="0" stop-color="#F0565B"/><stop offset=".45" stop-color="#FF8A8D"/><stop offset="1" stop-color="#A3232A"/></linearGradient></defs><path d="M15 37 3.4 10.5a12 12 0 1 1 23.2 0z" fill="url(#wg-pin)" stroke="#7A1A1F" stroke-width="1.2"/><circle cx="15" cy="11" r="5" fill="#FFE9A8" stroke="#8A580C" stroke-width="1.2"/></svg>'+wheelSVG(opts)+'</div><div class="result" id="wheel-res" aria-live="polite">'+esc(UI.wres||'')+'</div><div id="wheel-act"></div><button class="btn big" data-act="spin">Putar roda</button>';
}
function vGames(){
  return '<div class="gtiles">'+Object.keys(GDEF).map(id=>{const g=GDEF[id];return '<button class="gtile" style="--c:var(--k'+g.k+')" data-act="game:'+id+'"><span class="gi">'+GICON[g.ic]+'</span><span><b>'+g.n+'</b><small>'+g.tag+'</small></span></button>';}).join('')+'</div>';
}
const gameBusy=()=>!!(UI.spinning||UI.flipping||UI.rolling||UI.stacking);
function paintGame(){
  const el=document.getElementById('gamefs');if(!el||!UI.gfs)return;const k=UI.game,g=GDEF[k];
  el.innerHTML='<div class="gfs-top"><button class="ib" data-act="gback" aria-label="Kembali">'+ic('back')+'</button><h2 id="gfs-title" tabindex="-1">'+g.n+'</h2>'+
    (k==='wheel'?'<button class="ib" data-act="wedit" aria-label="Edit pilihan roda">'+ic('edit')+'</button>':'')+
    '<button class="ib" data-act="sfx" aria-label="Suara '+(SFX.on?'nyala':'mati')+'" aria-pressed="'+SFX.on+'">'+(SFX.on?GICON.sound:GICON.mute)+'</button></div>'+
    '<div class="gfs-body"><div class="gfs-in">'+gameBody(k)+'</div></div>';
  el.hidden=false;gameMount();
}
function openGame(k){
  if(!GDEF[k])return;UI.game=k;UI.gfs=true;document.body.classList.add('noscroll');paintGame();
  setTimeout(()=>{const t=document.getElementById('gfs-title');if(t)t.focus({preventScroll:true});},40);
}
function closeGame(){
  if(!UI.gfs)return;UI.gfs=false;UI.spinning=UI.flipping=UI.rolling=UI.stacking=false;STK=null;closeCeleb(true);
  const el=document.getElementById('gamefs');if(el){el.hidden=true;el.innerHTML='';}document.body.classList.remove('noscroll');
  const b=document.querySelector('.gtile[data-act="game:'+UI.game+'"]');if(b)b.focus({preventScroll:true});
}

  if(kt==='sum'){h+=famSection()+sumKita();}

    h+=grp('Perlu keputusanmu','spark','var(--k3)',need)+grp('Pengajuanmu','inbox','var(--accent)',mineAct)+grp('Menunggu '+esc(partner().n),'inbox','var(--warn)',waiting)+grp('Selesai','check','var(--in)',done);
    if(!S.props.length)h+='<div class="list empty"><b>Belum ada pengajuan</b>Mau beli yang agak besar? Ajukan dulu ke '+esc(partner().n)+'.</div>';
  }else if(kt==='gift'){
    const ready=giftsReady(),locked=giftsLocked(),opened=S.tx.filter(t=>t.by!==S.me&&S.opened[t.id]),secret=S.tx.filter(t=>t.by===S.me&&t.hidden),given=S.tx.filter(t=>t.by===S.me&&t.revealedAt);
    h+='<section class="card stack">'+hh('gift','Kado untukmu','var(--k3)')+(ready.length?'<div class="list">'+ready.map(giftRow).join('')+'</div>':'')+(locked.length?'<p class="small muted">'+locked.length+' kado masih tertutup. Hanya '+esc(partner().n)+' yang bisa membukanya.</p><div class="list">'+sortTx(locked).slice(0,5).map(giftRow).join('')+'</div>':'')+
      (!ready.length&&!locked.length?'<p class="small muted">Belum ada kado dari '+esc(partner().n)+'.</p>':'')+
      (opened.length?'<p class="hint">Sudah dibuka: '+opened.length+' kado, total '+fmt(opened.reduce((a,t)=>a+t.amount,0))+'.</p>':'')+'</section>';
    h+='<section class="card stack">'+hh('eye','Rahasiamu','var(--k4)')+'<p class="small muted">'+esc(partner().n)+' melihatnya sebagai kado tertutup.</p>'+(secret.length?'<div class="list">'+sortTx(secret).map(txRow).join('')+'</div>':'<p class="small muted">Tidak ada pemasukan rahasia.</p>')+
      (given.length?'<p class="hint">Sudah kamu buka untuk '+esc(partner().n)+': '+given.length+' kado.</p>':'')+'</section>';

    h+=vGames();

const BERSAMA_AV='<span class="mono" style="--c:var(--k7);width:34px;height:34px;border-radius:50%">'+ic('home')+'</span>';
function famSection(){
  const st=famStats(CUR),fa=famAll(),rows=fa.map(p=>({id:p.id,v:st.per[p.id]||0,n:st.cnt[p.id]||0})).concat([{id:'_',v:st.per._||0,n:st.cnt._||0}]),mx=Math.max(1,...rows.map(r=>r.v));

const bookPocket=b=>b&&b.pocket&&pocket(b.pocket)?b.pocket:null;
function defaultBookPocket(b,ty){const bp=bookPocket(b),firstNS=()=>{const c=activePockets().find(p=>!p.save&&p.id!==bp)||activePockets().find(p=>p.id!==bp);return c?c.id:null;};

function goldPrice(){return S.gold&&S.gold.idr||0;}
function curPrice(b){if(b.src==='gold'&&goldPrice())return Math.round(goldPrice()*(1+(b.premium||0)/100));if(b.price)return b.price;const ks=Object.keys(b.ph||{}).sort();return ks.length?b.ph[ks[ks.length-1]]:0;}
function invStats(b){let qty=b.qty0||0,inv=b.cost0||0;S.tx.forEach(t=>{if(t.biz!==b.id||masked(t))return;if(t.tfk==='beli'){qty+=t.qty||0;inv+=t.amount;}else if(t.tfk==='jual'){qty-=t.qty||0;inv-=t.amount;}});
  const price=curPrice(b),value=qty*price;return {qty,invested:inv,price,value,gain:price?value-inv:0,avg:qty>0?inv/qty:0,unit:b.unit||'gram'};}
function cicStats(b){const all=S.tx.filter(t=>t.biz===b.id&&!masked(t)),cm=mkey(todayISO());
  const isPay=t=>(t.type==='out'&&!t.fee)||(t.type==='loan'&&t.dir<0),L=all.filter(isPay),C=all.filter(t=>t.type==='loan'&&t.dir>0);
  const paid=L.reduce((a,t)=>a+t.amount,0),cair=C.reduce((a,t)=>a+t.amount,0),fees=all.filter(t=>t.type==='out'&&t.fee).reduce((a,t)=>a+t.amount,0);
  const total=(b.total||0)+cair,rem=Math.max(0,total-paid),inst=b.inst||0;
  return {L,C,paid,cair,fees,total,rem,inst,ml:inst?Math.ceil(rem/inst):0,paidThis:L.filter(t=>mkey(t.date)===cm).reduce((a,t)=>a+t.amount,0)};}
function piuStats(b){let given=0,back=0;S.tx.forEach(t=>{if(t.biz!==b.id||t.type!=='loan'||masked(t))return;if(t.dir<0)given+=t.amount;else back+=t.amount;});return {given,back,out:Math.max(0,given-back)};}

function tabStats(b){const bal=balances()[b.pocket]||0,tgt=b.target||0,now=new Date();let ml=0;if(b.deadline){const d=parseISO(b.deadline);ml=Math.max(0,(d.getFullYear()-now.getFullYear())*12+d.getMonth()-now.getMonth());}

function buildTips(k){
  const out=[],isCur=k===mkey(todayISO()),dayN=isCur?new Date().getDate():dim(k),t=totals(k),pk=addMonth(k,-1),pt=totals(pk,isCur?dayN:0),pFull=totals(pk);
  if(!t.n)return [{level:'info',title:'Mulai dari mencatat',body:'Catat setiap pengeluaran sekecil apa pun selama 2 minggu. Dari situ AI bisa memberi saran yang sesuai kebiasaanmu.'}];
  const B=balances();
  if(isCur){bookAlerts().forEach(x=>out.push(x));cbudAlerts(t).forEach(x=>out.push(x));}
  activePockets().forEach(p=>{if(B[p.id]<0)out.push({level:'bad',title:'Saldo '+esc(p.n)+' minus',body:'Kurang '+fmt(-B[p.id])+'. Pindahkan saldo dari kantong lain, atau cek apakah ada pengeluaran yang salah kantong.'});});
  if(t.in<=0)out.push({level:'warn',title:'Pemasukan belum dicatat',body:'Ada pengeluaran '+fmt(t.out)+' tapi belum ada pemasukan di '+mname(k)+'. Catat gaji atau hasil usaha supaya keseimbangannya terlihat.'});
  else{
    const ratio=t.out/t.in;
    if(ratio>1)out.push({level:'bad',title:'Pengeluaran melebihi pemasukan',body:'Defisit '+fmt(t.out-t.in)+'. Tunda belanja keinginan dan cek kategori terbesar dulu sebelum menambah utang.'});
    else if(ratio>=.8)out.push({level:'warn',title:'Sisa uang menipis',body:pct(t.out,t.in)+'% pemasukan sudah terpakai. Sisa '+fmt(t.in-t.out)+(isCur?' untuk '+(dim(k)-dayN)+' hari lagi, kira-kira '+fmtS((t.in-t.out)/Math.max(1,dim(k)-dayN))+' per hari.':'.')});
    else out.push({level:'good',title:'Keseimbangan sehat',body:'Kamu baru memakai '+pct(t.out,t.in)+'% pemasukan. Pindahkan sebagian sisa '+fmt(t.in-t.out)+' ke kantong tabungan sebelum terpakai.'});
    const r=rules(t);
    if(!isCur&&r.base>0&&r.save/r.base<.1)out.push({level:'warn',title:'Tabungan di bawah 10%',body:'Biasakan bayar diri sendiri dulu: begitu gajian, langsung sisihkan 10–20%, misalnya '+fmt(Math.round(r.base*.1/1000)*1000)+' per bulan.'});
    if(r.base>0&&r.want/r.base>.3)out.push({level:'warn',title:'Belanja keinginan lebih dari 30%',body:'Jajan, hiburan, dan belanja pribadi mencapai '+pct(r.want,r.base)+'% pemasukan rumah tangga. Turun ke 30% bisa menghemat sekitar '+fmt(Math.round((r.want-r.base*.3)/1000)*1000)+'.'});
    activeUsaha().forEach(b=>{const i=t.bi[b.id]||0,o=t.bo[b.id]||0;if(i||o){if(o>i)out.push({level:'warn',title:'Usaha '+esc(b.n)+' rugi '+fmtS(o-i),body:'Omzet '+fmtS(i)+', biaya '+fmtS(o)+' bulan ini. Buka mode usaha untuk melihat biaya terbesarnya.'});}});
    const cic=t.cats.cicilan||0;if(cic/t.in>.3)out.push({level:'bad',title:'Cicilan terlalu berat',body:'Cicilan '+pct(cic,t.in)+'% dari pemasukan. Batas aman di bawah 30%. Hindari cicilan atau paylater baru dulu.'});
    activePockets().forEach(p=>{if(p.save)return;const i=t.ip[p.id]||0,o=t.op[p.id]||0;if(i>0&&o>i*1.1&&o-i>100000)out.push({level:'warn',title:'Kantong '+esc(p.n)+' lebih banyak keluar',body:'Bulan ini keluar '+fmtS(o)+' padahal masuk '+fmtS(i)+'. Selisihnya diambil dari saldo lama kantong ini.'});});
  }
  const jj=inMonth(k).filter(x=>x.type==='out'&&x.cat==='jajan');
  if(jj.length>=8){const js=jj.reduce((a,b)=>a+b.amount,0);out.push({level:'warn',title:jj.length+' kali jajan bulan ini',body:'Totalnya '+fmt(js)+'. Pengeluaran kecil yang sering paling cepat menguras dompet. Kurangi separuhnya, hemat sekitar '+fmtS(js/2)+'.'});}
  sortedCats(t.cats).forEach(c=>{const prev=pt.cats[c.id]||0;if(prev>0&&c.v>prev*1.3&&c.v-prev>=Math.max(50000,t.out*.03))
    out.push({level:'warn',title:cat('out',c.id).n+' naik '+Math.round((c.v/prev-1)*100)+'%',body:'Dibanding '+mshort(pk)+(isCur?' pada tanggal yang sama':'')+': '+fmtS(prev)+' → '+fmtS(c.v)+'.'});});
  if(pt.out>0&&t.out<pt.out*.9)out.push({level:'good',title:'Lebih hemat dari '+mshort(pk),body:'Pengeluaran turun '+fmt(pt.out-t.out)+(isCur?' dibanding tanggal yang sama bulan lalu.':'.')});
  const Bd=S.settings.budget;
  if(Bd>0&&isCur){const pace=t.out/(Bd*dayN/dim(k));if(t.out>Bd)out.push({level:'bad',title:'Anggaran terlampaui',body:'Sudah '+fmt(t.out)+' dari anggaran '+fmt(Bd)+'.'});
    else if(pace>1.1)out.push({level:'warn',title:'Laju belanja lebih cepat dari anggaran',body:'Supaya cukup sampai akhir bulan, batasi '+fmtS((Bd-t.out)/(dim(k)-dayN+1))+' per hari.'});}
  const saveIds=S.pockets.filter(p=>p.save).map(p=>p.id),base=Math.max(pFull.out,t.out);
  const saved=S.tx.some(x=>(mkey(x.date)===k||mkey(x.date)===pk)&&((x.type==='out'&&x.cat==='tabungan')||(x.type==='tf'&&saveIds.indexOf(x.to)>=0)));
  if(!saved&&base)out.push({level:'info',title:'Siapkan dana darurat',body:'Belum ada uang masuk ke kantong tabungan dua bulan ini. Targetkan dana darurat 3–6 kali pengeluaran bulanan, sekitar '+fmtS(base*3)+' sampai '+fmtS(base*6)+'.'});
  else if(saveIds.length&&base){const sb=saveIds.reduce((a,id)=>a+(B[id]||0),0),mo=sb/base;
    out.push({level:mo>=3?'good':'info',title:'Tabungan setara '+mo.toLocaleString('id-ID',{maximumFractionDigits:1})+' bulan pengeluaran',body:mo>=6?'Dana darurat sudah aman. Sisanya bisa diarahkan ke tujuan jangka panjang.':'Target dana darurat 3–6 bulan, sekitar '+fmtS(base*3)+' sampai '+fmtS(base*6)+'.'+(mo<3?' Kurang '+fmtS(base*3-sb)+' untuk batas bawah.':'')});}
  const big=inMonth(k).filter(x=>x.type==='out').sort((a,b)=>b.amount-a.amount)[0];
  if(big)out.push({level:'info',title:'Pengeluaran terbesar',body:esc(big.desc)+' sebesar '+fmt(big.amount)+' ('+cat('out',big.cat).n+', dari kantong '+esc(pname(big.pocket))+').'});
  const rank={bad:0,warn:1,good:2,info:3};out.sort((a,b)=>rank[a.level]-rank[b.level]);
  return out;
}

  const tx=S.tx.filter(t=>!t.sample&&!t.sealed).map(t=>(!full&&t.hidden)?{id:t.id,type:t.type,by:t.by,biz:t.biz,date:t.date,ts:t.ts,u:t.u,sealed:true,amount:0,cat:t.cat,pocket:t.pocket,desc:''}:t);
  const learned=full?S.learned:{out:S.learned.out,bout:S.learned.bout};
  return {app:'kas-keluarga',v:4,full:!!full,from:S.device,fromMember:S.me,at:Date.now(),members:S.members,people:(S.people||[]).filter(p=>!p.sample),forWords:S.forWords,pockets:S.pockets,biz:S.biz,bizWords:S.bizWords,props:S.props.filter(p=>!p.sample),tx,deleted:S.deleted,learned,catPocket:S.catPocket,settings:S.settings};
}

function mergeById(list,inc,find){(inc||[]).forEach(x=>{if(!x||!x.id)return;const cur=find(x.id);if(!cur)list.push(Object.assign({},x));else if((x.u||0)>(cur.u||0))Object.assign(cur,x);});}
function merge(o){
  if(!o||o.app!=='kas-keluarga'||!Array.isArray(o.tx))throw new Error('format');
  const byId={};let added=0,updated=0,gifts=0;S.tx.forEach(t=>byId[t.id]=t);
  if(o.tx.length&&S.sample){S.tx=S.tx.filter(t=>!t.sample);S.props=S.props.filter(p=>!p.sample);S.people=(S.people||[]).filter(p=>!p.sample);S.sample=false;S.pockets.forEach(p=>{if(p.u===1)p.start=0;});S.tx.forEach(t=>byId[t.id]=t);}
  mergeById(S.members,(o.members||[]).filter(m=>!m.fam),mem);S.people=S.people||[];mergeById(S.people,(o.people||[]).map(x=>{const y=Object.assign({},x);delete y.fam;return y;}),id=>S.people.find(p=>p.id===id));
  S.forWords=S.forWords||{};Object.keys(o.forWords||{}).forEach(w=>{if(!S.forWords[w])S.forWords[w]=o.forWords[w];});mergeById(S.pockets,o.pockets,pocket);mergeById(S.biz,o.biz,bizOf);mergeById(S.props,o.props,id=>S.props.find(p=>p.id===id));
  Object.keys(o.bizWords||{}).forEach(w=>{if(!S.bizWords[w])S.bizWords[w]=o.bizWords[w];});
  Object.keys(o.deleted||{}).forEach(id=>{S.deleted[id]=Math.max(S.deleted[id]||0,o.deleted[id]);});
  o.tx.forEach(t=>{if(!t||!t.id)return;if(!t.sealed&&!(t.amount>0))return;if(S.deleted[t.id]&&S.deleted[t.id]>=(t.u||t.ts))return;if(!t.pocket)t.pocket='gaji';const cur=byId[t.id];
    if(!cur){S.tx.push(t);byId[t.id]=t;added++;if(t.revealedAt&&t.by!==S.me)gifts++;return;}
    if(t.sealed&&!cur.sealed)return;
    if(cur.sealed&&!t.sealed){delete cur.sealed;delete cur.hidden;delete cur.enc;Object.assign(cur,t);updated++;if(t.revealedAt&&t.by!==S.me)gifts++;return;}
    if((t.u||t.ts)>(cur.u||cur.ts)){if(!t.hidden)delete cur.hidden;Object.assign(cur,t);updated++;if(t.revealedAt&&t.by!==S.me&&!S.opened[t.id])gifts++;}});
  const before=S.tx.length;S.tx=S.tx.filter(t=>!(S.deleted[t.id]&&S.deleted[t.id]>=(t.u||t.ts)));const removed=before-S.tx.length;
  ['out','in','bout','bin'].forEach(ty=>{S.learned[ty]=S.learned[ty]||{};const L=(o.learned||{})[ty]||{};Object.keys(L).forEach(c=>{S.learned[ty][c]=S.learned[ty][c]||{};Object.keys(L[c]).forEach(f=>{S.learned[ty][c][f]=Math.max(S.learned[ty][c][f]||0,L[c][f]);});});
    const cp=(o.catPocket||{})[ty]||{};S.catPocket[ty]=S.catPocket[ty]||{};Object.keys(cp).forEach(c=>{if(!S.catPocket[ty][c])S.catPocket[ty][c]=cp[c];});});
  if(o.settings&&(((o.settings.u||0)>(S.settings.u||0))||(!S.settings.budget&&o.settings.budget)))Object.assign(S.settings,o.settings);
  ['pockets','biz','props','people'].forEach(k=>{S[k]=S[k].filter(x=>!(S.deleted[x.id]&&S.deleted[x.id]>=(x.u||0)));});
  buildModel();save();return {added,updated,removed,gifts};
}

function shareData(full){

function downloadFallback(txt,name){
  if(window.KAS_ARTIFACT){const dt=document.querySelector('#panel details');if(dt)dt.open=true;copyText(txt);return;}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);
    toast('File disimpan. Kirim lewat Quick Share/AirDrop dari folder Unduhan.');}catch(e){copyText(txt);}
}

  if(e.key==='Enter'&&(e.target.id==='fdesc'||e.target.id==='famt')){e.preventDefault();saveForm();}
});
/* ---------- back button / gesture ----------
   One step back per press: celebration, sheet, game, then the tab back to Beranda.
   On Beranda the first press only warns; a second press within a few seconds leaves.
   Android APK: the shim's backButton listener calls window.kasBack(). Browser and installed
   PWA: a single guard history entry turns each back press into a popstate. */
const EXIT_WINDOW=2800;let exitArmedUntil=0;
const IS_APK=/KasKeluargaAndroid/.test(navigator.userAgent)||!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
function backStep(){
  if(document.getElementById('lockov'))return false;
  if(document.getElementById('celeb')){closeCeleb();return true;}
  if(!document.getElementById('sheet').hidden){closeSheet();return true;}
  if(UI.gfs){closeGame();return true;}
  if(TAB!=='home'){TAB='home';UI.bd=null;UI.bm=null;render(true);window.scrollTo(0,0);return true;}
  return false;
}
function warnExit(){exitArmedUntil=Date.now()+EXIT_WINDOW;toast('Tekan kembali sekali lagi untuk keluar');}
window.kasBack=function(){
  if(backStep()){exitArmedUntil=0;return true;}
  if(Date.now()<exitArmedUntil){exitArmedUntil=0;const t=document.getElementById('toast');if(t)t.hidden=true;return false;}
  warnExit();return true;
};
function armBackGuard(){if(IS_APK)return;try{if(!(history.state&&history.state.kasGuard))history.pushState({kasGuard:1},'');}catch(e){}}
window.addEventListener('popstate',()=>{
  if(IS_APK||(history.state&&history.state.kasGuard)||/gabung=/.test(location.hash))return;
  if(backStep()){exitArmedUntil=0;armBackGuard();return;}
  // Now on the page's own entry: the next back press leaves. Re-arm on the next tap.
  warnExit();
});
['pointerdown','keydown'].forEach(t=>document.addEventListener(t,()=>{if(Date.now()>=exitArmedUntil)armBackGuard();},true));
// APKs built before the shim knew about kasBack only close sheets and then minimise; route that through kasBack.
function hookOldShimBack(){
  if(window.__kasShimBack)return;
  const app=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
  if(!app||typeof app.minimizeApp!=='function'||app.minimizeApp.__kas)return;
  const minimize=app.minimizeApp;
  const f=function(){return window.kasBack()?Promise.resolve():minimize.apply(app,arguments);};f.__kas=1;
  try{app.minimizeApp=f;}catch(e){}
}
if(IS_APK){hookOldShimBack();document.addEventListener('DOMContentLoaded',hookOldShimBack);window.addEventListener('load',hookOldShimBack);}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;});
render(true);
showLock();bioProbe().then(v=>{BIO_OK=v;});
loadKey().then(()=>{unlockOwnSealed();syncNow();});
checkInviteHash();window.addEventListener('hashchange',checkInviteHash);
fetchGold();setInterval(()=>{if(document.visibilityState==='visible')fetchGold();},36e5);
setInterval(()=>{if(document.visibilityState==='visible')syncNow();},15000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow();});
window.addEventListener('online',()=>syncNow());
window.__kas={parseReceipt,parseAmount,predict,merge,buildTips,balances,S:()=>S,exportObj,syncNow,SB,setPin};
})();
</script>
