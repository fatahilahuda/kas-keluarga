<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}
.card hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0}
/* Modul tambahan: page header, home shortcuts, lists */
.ptop{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.ptop h1{font:700 22px/1.2 var(--display);margin:0}
.ptop .ib{flex:none}
.mcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0}
.mcard{display:flex;align-items:center;gap:10px;text-align:left;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.mcard .ico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.mcard .ico svg{width:18px;height:18px}
.mcard b{display:block;font-size:14px}
.mcard small{color:var(--muted);font-size:12px}
.shlist{display:flex;flex-direction:column}
.shrow{display:flex;align-items:center;gap:4px;border-top:1px solid var(--line)}
.shrow:first-child{border-top:0}
.shchk{flex:1;display:flex;align-items:center;gap:12px;padding:12px 2px;background:none;border:0;color:var(--ink);text-align:left;min-height:48px}
.shchk .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--line-2,var(--muted));display:grid;place-items:center;flex:none;color:transparent;transition:background .15s,border-color .15s}
.shchk .box svg{width:15px;height:15px}
.shrow.done .box{background:var(--in);border-color:var(--in);color:#fff}
.shchk .sn{flex:1;font-size:15px}
.shrow.done .sn{text-decoration:line-through;color:var(--muted)}
.shchk .sp{font-size:13px;color:var(--muted)}
.shchk .sby{font-size:11px;color:var(--muted);background:var(--surface-2);padding:2px 8px;border-radius:99px}
.shbar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;margin-top:12px;border-radius:18px;
  background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.shbar small{display:block;font-size:12px}
.shbar b{font:700 18px var(--display)}
.evlist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.evcard{display:flex;align-items:center;gap:12px;text-align:left;padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.evcard .ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.evcard .ico svg{width:19px;height:19px}
.ev-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ev-b b{font-size:15px}
.ev-b small{color:var(--muted);font-size:12.5px}
.ev-b .track{display:block;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.ev-b .fill{display:block;height:100%;background:var(--c);border-radius:3px}
.ev-b .fill.bad{background:var(--out)}
.ev-b .pill{align-self:flex-start;margin-top:3px}
.evact{display:flex;align-items:center;gap:4px}
.qk-in .btn,.shbar .btn{flex:none;width:auto;min-height:48px;padding-left:16px;padding-right:16px}
.shbar>div{min-width:0}
.btn[disabled]{opacity:.5;pointer-events:none}
.ptop+.btn,.ptop+section{margin-top:0}
.weekcard p{margin:4px 0 0}
/* Cek catatan: home card and story overlay */
.cekcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:12px 0;padding:14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.cek-rings{position:relative;width:40px;height:40px;flex:none;border-radius:50%;background:conic-gradient(var(--accent),var(--k3),var(--k1),var(--accent));padding:2.5px}
.cek-rings i{position:absolute;inset:2.5px;border-radius:50%;background:var(--surface)}
.cek-rings i+i{inset:7px;background:color-mix(in srgb,var(--accent) 18%,var(--surface))}
.cek-rings i+i+i{inset:15px;background:var(--accent)}
.cekcard.has-dup .cek-rings{background:conic-gradient(var(--warn,#d98a00),var(--out),var(--warn,#d98a00))}
.cek-b{flex:1;min-width:0}.cek-b b{display:block;font-size:15px}.cek-b small{color:var(--muted);font-size:12.5px}
.cek-go{display:flex;align-items:center;gap:2px;font-weight:600;color:var(--accent);font-size:14px}.cek-go svg{width:16px;height:16px}
.dupb{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.02em;color:var(--warn-ink,#8a5300);background:color-mix(in srgb,var(--warn,#d98a00) 18%,transparent);padding:1px 6px;border-radius:6px;margin-right:6px;vertical-align:1px}
html.story-on,html.story-on body{overflow:hidden}
.story{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;background:var(--bg);padding:max(10px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));animation:stIn .24s cubic-bezier(.2,.8,.2,1);touch-action:pan-y}
.story[hidden]{display:none}
.st-bars{display:flex;gap:4px}
.st-bars i{flex:1;height:3px;border-radius:2px;background:var(--line);overflow:hidden;position:relative}
.st-bars i.on{background:var(--accent)}
.st-bars i.cur{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
.st-bars i.dup.on,.st-bars i.dup.cur{background:var(--warn,#d98a00)}
.st-head{display:flex;align-items:center;gap:6px;margin-top:8px;min-height:44px}
.st-count{flex:1;font-size:13px;color:var(--muted);font-weight:600}
.st-head .link{padding:10px}
.st-slide.in-r{animation:stR .26s cubic-bezier(.2,.8,.2,1)}.st-slide.in-l{animation:stL .26s cubic-bezier(.2,.8,.2,1)}
@keyframes stIn{from{opacity:0;transform:translateY(16px)}}
@keyframes stR{from{opacity:0;transform:translateX(28px)}}
@keyframes stL{from{opacity:0;transform:translateX(-28px)}}
@media (prefers-reduced-motion:reduce){.story,.st-slide.in-r,.st-slide.in-l{animation:none}}
.st-why{color:var(--muted);font-size:14px;margin:-4px 2px 14px;line-height:1.45}
.st-slide{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;padding-top:4px}
.st-q{font:700 22px/1.2 var(--display);margin:2px 2px 10px}
.st-card{display:flex;align-items:center;gap:14px;padding:14px 14px 14px 16px;border-radius:22px;background:var(--surface);border:1px solid var(--line)}
.st-card .mono{width:52px;height:52px;flex:none}.st-card .mono svg{width:24px;height:24px}
.st-hd{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.st-amt{font:700 30px/1.1 var(--display);letter-spacing:-.01em}
.st-amt.in{color:var(--in)}
.st-hb{background:none;border:0;color:inherit;padding:2px 6px;margin-left:-6px;border-radius:10px;display:inline-flex;align-items:center;gap:6px;max-width:100%;text-align:left}
.st-hb.on{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.st-hb.st-desc{font-size:16px;font-weight:600}
.st-hb.st-desc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-hp{width:15px;height:15px;color:var(--accent);flex:none}
.st-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.st-f{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;min-height:72px;padding:11px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);color:var(--ink);text-align:left}
.st-f.ro{background:none;border-style:dashed}
.st-fl{display:flex;align-items:center;gap:6px;color:var(--muted)}
.st-fl svg{width:16px;height:16px}.st-fl .dot{width:11px;height:11px}.st-fl .av{transform:scale(.9)}
.st-fl small{font-size:12.5px;font-weight:500}
.st-f b{font-size:16px;font-weight:650;line-height:1.25;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-sug{margin-top:12px}
.st-sug>span{display:block;font-size:13px;color:var(--muted);margin:0 2px 6px}
.st-sugr{display:flex;gap:6px;overflow:hidden}
.st-sugr .chip{flex:none;white-space:nowrap}
.st-ed{margin-top:10px;padding:12px 14px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--accent);min-height:0;overflow:hidden}
.st-edt{display:flex;align-items:center;justify-content:space-between;margin:-4px -6px 8px 0}
.st-edt b{font-size:15px}
.st-dense{gap:6px}
.st-dense .chip{min-height:36px;font-size:14px;padding:0 10px}
.st-dense .chip .ci{width:15px;height:15px}
.st-ed .pchips{grid-template-columns:1fr 1fr}
.st-ed .hint{margin:8px 2px 0}
.st-inrow{display:flex;gap:8px}.st-inrow .inp{flex:1;min-width:0;font-size:17px}.story .st-inrow .btn{flex:none;width:auto;padding:0 18px}
/* answer buttons stay in reach while the card and editor scroll behind them */
.st-acts{margin-top:auto;padding-top:22px;display:flex;flex-direction:column;gap:10px;position:sticky;bottom:0;z-index:2;background:linear-gradient(to bottom,transparent,var(--bg) 20px)}
.st-acts .btn,.st-dcard .btn{display:flex;align-items:center;justify-content:center;gap:8px;line-height:1}
.st-acts .btn svg,.st-dcard .btn svg{width:20px;height:20px;flex:none}
.story .btn.st-main{min-height:56px;border-radius:16px;font-size:16px}
.st-row{display:flex;gap:10px}.st-row .btn{flex:1}
.story .btn.st-sec{min-height:48px;border-radius:14px;background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:600}
.story .btn.st-sec svg{color:var(--muted)}
.story .btn.st-del,.story .btn.st-del svg{color:var(--out)}
.st-dups{display:flex;flex-direction:column;gap:8px}
.st-dcard{display:flex;align-items:center;gap:10px;padding:12px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.st-dd{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.st-dd b{font-size:14.5px}.st-dd small{font-size:12px;color:var(--muted)}
.st-da{font-weight:700;font-size:14px}
.story .st-dcard .btn{flex:none;width:44px;height:44px;min-height:44px;padding:0;border-radius:12px}.st-dcard .btn svg{width:19px;height:19px}
.st-end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.st-check{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink,#fff);margin-bottom:10px;animation:stPop .4s cubic-bezier(.3,1.6,.5,1)}
.st-check svg{width:42px;height:42px}
@keyframes stPop{from{transform:scale(.5);opacity:0}}
/* Aktivitas */
.loglist{display:flex;flex-direction:column}
.logday{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 2px 6px}
.logday:first-child{margin-top:0}
.logrow{display:flex;align-items:flex-start;gap:10px;padding:10px 4px;border-top:1px solid var(--line)}
.logday+.logrow{border-top:0}
.logrow[role=button]{cursor:pointer}
.logic{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.logic svg{width:15px;height:15px}
.op-add .logic{background:color-mix(in srgb,var(--in) 15%,transparent);color:var(--in)}
.op-del .logic{background:color-mix(in srgb,var(--out) 15%,transparent);color:var(--out)}
.op-edit .logic{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.logb{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.logb b{font-size:14px;font-weight:600;line-height:1.35}
.logb small{font-size:12.5px;color:var(--muted);line-height:1.45}
.logb .logwarn{color:var(--warn-ink,#8a5300);font-weight:600}
.logt{font-size:12px;color:var(--muted);flex:none;padding-top:2px}
.logrow.fresh .logb b::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--out);margin-right:6px;vertical-align:2px}
/* Running glow around the screen edge (catat cepat and voice), in Muarakas colours.
   Blur sits on the wrapper and the ring mask on the child, so the inner edge fades to nothing (no line). */
@property --ga{syntax:'<angle>';initial-value:0deg;inherits:false}
.glow{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .45s ease}
#glow{z-index:39}
.glow.on{opacity:1}
.glow i{position:absolute;inset:0;filter:blur(var(--gb,22px))}
.glow b{position:absolute;inset:0;border-radius:var(--scr,44px);padding:var(--gw,26px);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.glow .base b{background:conic-gradient(from var(--ga),#3BB3AB,#7F96FF,#A496F0,#E0C25A,#4FC1B4,#3BB3AB);opacity:.5;animation:glowspin 8s linear infinite}
.glow .run{--gb:16px}
.glow .run b{--gw:36px;background:conic-gradient(from var(--ga),transparent 0deg 190deg,#3BB3AB 240deg,#7F96FF 280deg,#C9B8FF 312deg,#FFE8A3 336deg,transparent 360deg);animation:glowspin 2.8s linear infinite}
.glow .run2 b{--gw:28px;background:conic-gradient(from calc(var(--ga) + 180deg),transparent 0deg 250deg,#4FC1B4 300deg,#A496F0 335deg,transparent 360deg);opacity:.8;animation:glowspin 2.8s linear infinite}
.glow.listen .base b{--gw:calc(30px + var(--lv,0) * 26px);opacity:.7}
.glow.listen .run b{--gw:calc(42px + var(--lv,0) * 34px);animation-duration:1.7s}
.glow.listen .run2 b{--gw:calc(32px + var(--lv,0) * 26px);animation-duration:1.7s}
.glow.saved b{background:conic-gradient(from var(--ga),#4CC48E,#3BB3AB,#B6F0D6,#4CC48E)!important;animation-duration:1.2s}
@keyframes glowspin{to{--ga:360deg}}
@media (prefers-reduced-motion:reduce){.glow b{animation:none}}
/* Quick add popup (Android widget, shortcut and Quick Settings tile open index.html?quick=voice|text) */
html.quick,html.quick body{background:transparent!important;min-height:100%}
html.quick body>*:not(#qk):not(#vo):not(#toast):not(#sheet):not(#glow):not(script){display:none!important}
.qk{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end;z-index:40}
.qk-scrim{position:absolute;inset:0;background:transparent}
html.quick body{background:rgba(6,12,10,.26)!important;transition:background .3s}
.qk-sheet{position:relative;background:color-mix(in srgb,var(--surface) 64%,transparent);-webkit-backdrop-filter:blur(28px) saturate(1.5);backdrop-filter:blur(28px) saturate(1.5);border:1px solid color-mix(in srgb,#fff 16%,transparent);border-bottom:0;transition:opacity .25s,transform .25s;color:var(--ink);border-radius:26px 26px 0 0;padding:8px 16px calc(18px + var(--nb,0px) + env(safe-area-inset-bottom));box-shadow:0 -10px 34px rgba(0,0,0,.2);animation:qku .28s cubic-bezier(.2,.8,.2,1);max-height:94vh;overflow:auto}
.qk-sheet .grab{margin:0 auto 6px}
.qk-top{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.qk-brand{display:flex;align-items:center;gap:7px;font:700 15px var(--display);margin-right:auto}
.qk-brand img{width:22px;height:22px}
.qk-x{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface-2);color:var(--muted);display:grid;place-items:center}
.qk-x svg{width:18px;height:18px}
.qk-in{display:flex;gap:8px;align-items:center}
.qk-in .inp{flex:1;min-width:0}
.qk .qk-in .inp{font-size:17px;padding-top:14px;padding-bottom:14px}
.mic-btn{width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.mic-btn svg{width:22px;height:22px}
.qk-mid{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:12px 0 2px}
.qk-amt{font:700 32px/1.1 var(--display);letter-spacing:-.5px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qk-amt.zero{color:var(--muted)}
.qk .seg{flex:1}
.qk .ai{margin-top:8px}
.qk-l{font-size:12px;color:var(--muted);font-weight:700;margin:12px 0 6px}
.qk .chips,.qk .pchips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:3px 16px 4px;margin:-3px -16px 0}
.qk .chips::-webkit-scrollbar,.qk .pchips::-webkit-scrollbar{display:none}
.qk .pchips{display:flex;gap:8px}
.qk .chip,.qk .pchip{flex:none}
.qk .pchip{min-width:128px}
/* The scroll row would clip an outer ring: draw the selected ring inside the chip's own edge instead */
.qk .pchip[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:color-mix(in srgb,var(--c) 9%,var(--surface))}
.qk #fwarn:not(:empty),.qk #fhide:not(:empty){margin-top:12px}
/* Native popup (Android): the sheet is its own window, blurred by the system only behind the card.
   The screen-edge glow and the dim are drawn natively behind it. */
html.quick.nq body{background:transparent!important}
html.quick.nq #glow,html.quick.nq .vo .glow{display:none!important}
html.quick.nq .qk{justify-content:flex-start;overflow:hidden}
html.quick.nq .qk-sheet,html.quick.nq .vo-card{flex:none;overflow:visible}
html.quick.nq .vo{align-items:flex-start}
html.quick.nq .qk-sheet,html.quick.nq .vo-card{border-radius:28px;max-height:none;animation:none;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding-bottom:18px;
  background:color-mix(in srgb,var(--surface) 72%,transparent);border:1px solid color-mix(in srgb,#fff 14%,transparent)}
html.quick.nq.noblur .qk-sheet,html.quick.nq.noblur .vo-card{background:color-mix(in srgb,var(--surface) 95%,transparent)}
html.quick.nq .vo-card{text-align:center}
.qk .chip.addc{display:none}
.qk.locked .pchip small{display:none}
.qk.locked #fwarn{display:none} /* would show the pocket balance */
.qk .btn.qk-save{margin-top:16px;width:100%;font-size:16px;padding:15px}
.qk-done{text-align:center;padding:22px 0 10px}
.qk-ok{width:64px;height:64px;border-radius:50%;background:var(--in);color:#fff;display:grid;place-items:center;margin:0 auto 12px;animation:qkpop .35s cubic-bezier(.2,1.4,.4,1)}
.qk-ok svg{width:32px;height:32px}
.qk-damt{font:700 28px var(--display);margin-top:4px}
@keyframes qku{from{transform:translateY(100%)}to{transform:none}}
@keyframes qkf{from{opacity:0}}
@keyframes qkpop{from{transform:scale(.4);opacity:0}}
/* Voice: Muarakas's own listening sheet, never the Google dialog */
.vo{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end}
.vo-scrim{position:absolute;inset:0;background:rgba(6,12,10,.5);animation:qkf .2s ease}
html.quick .vo-scrim{background:transparent}
html.quick body:has(#vo) .qk-sheet{opacity:0;transform:translateY(24px);pointer-events:none}
.vo .glow{opacity:1}

.pbars span{font-size:11px;color:var(--muted)}
.pbars div.on span{color:var(--ink);font-weight:700}
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat2>div{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}

.forline{display:inline-flex;align-items:center}
.forline .av{width:14px;height:14px;font-size:8px;margin-right:3px;vertical-align:0}

/* proposals: thumbnail + loud amount */
.prop-top{display:grid;grid-template-columns:46px 1fr;gap:12px;align-items:center}
.prop-top .mono{width:46px;height:46px;border-radius:14px}
.prop-top .mono svg{width:22px;height:22px}
.prop-top h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prop .who{font-size:12.5px;color:var(--muted);display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px}
.btns3 .btn,.btns .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn svg{width:18px;height:18px}

/* games: tile picker + full-screen stage */
.gtiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gtile{border:1px solid var(--line);background:var(--surface);border-radius:20px;overflow:hidden;padding:0 0 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--ink);font:inherit;transition:transform .12s;box-shadow:0 1px 2px color-mix(in srgb,var(--ink) 6%,transparent)}
.gtile:active{transform:scale(.96)}
.gtile .gi{width:56px;height:56px;border-radius:16px;background:var(--c);color:#fff;display:grid;place-items:center;margin:28px 0}
.gtile .gi svg{width:28px;height:28px}
.gtx{display:flex;flex-direction:column;gap:2px;min-width:0;padding:0 10px}
.gtile b{font-family:var(--display);font-size:16.5px;line-height:1.15}
.gtile small{font-size:12px;color:var(--muted);line-height:1.3}
/* previews */
.gpv{position:relative;width:100%;height:112px;overflow:hidden;display:grid;place-items:end center;pointer-events:none;background:color-mix(in srgb,var(--c) 14%,var(--surface));border-bottom:1px solid color-mix(in srgb,var(--c) 22%,var(--line))}

.pv-spin{transform-origin:150px 150px;animation:pvspin 9s linear infinite}

.pv-dice{display:flex;gap:18px;align-items:flex-end;padding-bottom:18px}
.pv-dice .d3{--s:42px}
.pv-dice .d3 .dsh{bottom:-11px;height:10px}
.pv-hop .dtilt{animation:pvhop 2.6s var(--dl) cubic-bezier(.3,0,.3,1) infinite}
.pv-hop .cube{transition:none;transform:rotateX(var(--rx)) rotateY(var(--ry));animation:pvtumble 2.6s var(--dl) cubic-bezier(.2,.6,.3,1) infinite}
.pv-hop .dsh{animation:pvshadow 2.6s var(--dl) cubic-bezier(.3,0,.3,1) infinite}

.pv-suit{display:flex;gap:12px;align-items:flex-end;padding-bottom:14px;font-size:36px;line-height:1}

@keyframes pvpop{0%,34%,100%{transform:none}10%{transform:translateY(-20px) scale(1.22) rotate(-8deg)}22%{transform:translateY(0) scale(.96)}28%{transform:scale(1.03)}}
.pv-scr{position:relative;width:136px;height:70px;margin-bottom:14px;border-radius:12px;overflow:hidden;box-shadow:0 4px 0 color-mix(in srgb,var(--k4) 50%,#000),0 8px 14px rgba(0,0,0,.14)}
.pv-prize{position:absolute;inset:0;background:linear-gradient(135deg,var(--k3),var(--k4));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}

.pv-foil{position:absolute;inset:0;background:linear-gradient(135deg,#ECEEF2,#B4B9C2 40%,#E9EBEF 60%,#A3A8B1);display:grid;place-items:center;animation:pvscratch 4.2s ease-in-out infinite}

@keyframes pvscratch{0%,14%{clip-path:inset(0 0 0 0);opacity:1}64%,84%{clip-path:inset(0 0 0 100%);opacity:1}85%{clip-path:inset(0 0 0 100%);opacity:0}86%{clip-path:inset(0 0 0 0);opacity:0}100%{clip-path:inset(0 0 0 0);opacity:1}}
.pv-scraper{position:absolute;top:50%;left:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#FFF4C4,#E9B840 52%,#A8770E);box-shadow:0 2px 3px rgba(0,0,0,.3);animation:pvscraper 4.2s ease-in-out infinite}
@keyframes pvscraper{0%,12%{transform:translate(-6px,8px);opacity:0}16%{opacity:1}24%{transform:translate(30px,-14px)}34%{transform:translate(54px,12px)}44%{transform:translate(80px,-12px)}54%{transform:translate(106px,10px)}64%{transform:translate(140px,-4px);opacity:1}70%,100%{transform:translate(150px,-4px);opacity:0}}
.pv-tag{position:relative;height:96px;width:120px}
.pv-str{position:absolute;left:60px;top:0;width:2px;height:30px;background:color-mix(in srgb,var(--ink) 35%,transparent);border-radius:1px}
.pv-tagb{position:absolute;left:24px;top:28px;width:74px;height:58px;display:grid;place-items:end center;padding-bottom:10px;box-sizing:border-box;color:#fff;background:var(--k4);clip-path:polygon(50% 0,100% 26%,100% 100%,0 100%,0 26%);border-radius:0 0 10px 10px;transform-origin:50% 0;animation:pvswing 2.4s ease-in-out infinite alternate;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.pv-hole{position:absolute;top:13px;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:var(--bg);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}

.pv-ssh{position:absolute;bottom:4px;left:4px;right:4px;height:14px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.28),transparent)}
.pv-sc{position:absolute;left:8px;width:64px;height:16px;bottom:calc(10px + var(--i) * 11px);margin-left:calc((var(--i) - 2) * 2.5px);border-radius:50%;background:radial-gradient(ellipse at 40% 30%,#FFF4C4,#E9B840 55%,#C38D1A);box-shadow:0 4px 0 #A8770E,0 5px 3px rgba(0,0,0,.2);opacity:0}

@keyframes pvdrop0{0%,8%{transform:translateY(-90px);opacity:0}9%{opacity:1}14%{transform:translateY(0)}16%{transform:translateY(-3px)}18%,86%{transform:translateY(0);opacity:1}96%,100%{transform:translateY(0);opacity:0}}
@keyframes pvdrop1{0%,20%{transform:translateY(-90px);opacity:0}21%{opacity:1}26%{transform:translateY(0)}28%{transform:translateY(-3px)}30%,86%{transform:translateY(0);opacity:1}96%,100%{transform:translateY(0);opacity:0}}
@keyframes pvdrop2{0%,32%{transform:translateY(-90px);opacity:0}33%{opacity:1}38%{transform:translateY(0)}40%{transform:translateY(-3px)}42%,86%{transform:translateY(0);opacity:1}96%,100%{transform:translateY(0);opacity:0}}
@keyframes pvdrop3{0%,44%{transform:translateY(-90px);opacity:0}45%{opacity:1}50%{transform:translateY(0)}52%{transform:translateY(-3px)}54%,86%{transform:translateY(0);opacity:1}96%,100%{transform:translateY(0);opacity:0}}
@keyframes pvdrop4{0%,56%{transform:translateY(-90px);opacity:0}57%{opacity:1}62%{transform:translateY(0)}64%{transform:translateY(-3px)}66%,86%{transform:translateY(0);opacity:1}96%,100%{transform:translateY(0);opacity:0}}
@media (prefers-reduced-motion:reduce){.gpv *{animation:none!important}.pv-sc{opacity:1}.pv-foil{clip-path:inset(0 0 0 55%)}.pv-scraper{display:none}}

.gfs-top{display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px))}

.coin .ce{position:absolute;inset:1px;border-radius:50%;background:linear-gradient(90deg,#6E4805,#C99520 22%,#F4D06A 48%,#C38E16 74%,#6E4805);box-shadow:inset 0 0 0 2px rgba(90,58,0,.35)}
.coin .cf{background:radial-gradient(circle at 34% 26%,#FFF7D2 0,#F4CD58 32%,#DDA626 62%,#A9740B 100%);border:0;box-shadow:inset 0 0 0 6px #C8931E,inset 0 0 0 8px rgba(255,240,190,.55),inset 0 -10px 16px rgba(90,58,0,.28),inset 0 6px 10px rgba(255,255,255,.35);color:#6E4805}
.coin .cf.a{transform:translateZ(8.5px)}
.coin .cf.b{transform:rotateX(180deg) translateZ(8.5px)}
.coin .cring{position:absolute;inset:15px;border-radius:50%;border:1.5px dotted rgba(110,72,5,.5)}
.coin .cf b{font-size:44px;text-shadow:0 1px 0 rgba(255,255,255,.65),0 -1px 0 rgba(90,58,0,.35);letter-spacing:-.02em}
.coin .cf small{text-shadow:0 1px 0 rgba(255,255,255,.55)}
.coin .cf .melati{width:86px;height:86px;margin:-8px 0 -4px;filter:drop-shadow(0 1px 0 rgba(255,255,255,.6)) drop-shadow(0 -1px 0 rgba(90,58,0,.3))}
.melati .pt ellipse{fill:#F8DC7E;stroke:#7E5809;stroke-width:1.3}
.melati .pt2 ellipse{fill:#FCEBAA;stroke:#7E5809;stroke-width:1}
.melati .ct{fill:#C9921C;stroke:#6E4805;stroke-width:1.2}
.melati .lf{fill:#DDB244;stroke:#6E4805;stroke-width:1.2}
.swapbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:999px;padding:8px 12px;font-weight:700;font-size:13.5px;box-shadow:0 3px 0 var(--line);flex:none}
.swapbtn svg{width:16px;height:16px}
.swapbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.swapbtn:disabled{opacity:.5}
.coin-sides.swap>span{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}

/* suit */
.suit-picks button{--c:var(--accent);border:0;color:var(--ink);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 26%,var(--surface)),color-mix(in srgb,var(--c) 14%,var(--surface)));box-shadow:0 6px 0 color-mix(in srgb,var(--c) 62%,#000),0 12px 18px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.6);margin-bottom:6px;transition:transform .1s,box-shadow .1s}
.suit-picks button:active{transform:translateY(5px);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 62%,#000),0 4px 8px rgba(0,0,0,.12)}
.suit-picks button span{font-size:44px;filter:drop-shadow(0 5px 3px rgba(0,0,0,.25))}
.suit-duel{perspective:760px}
.scard{width:108px;height:142px;transform:rotateX(10deg);transition:transform .7s cubic-bezier(.3,1.4,.5,1)}
.scard.open{transform:rotateX(10deg) rotateY(180deg)}
.scard .se{position:absolute;inset:0;border-radius:16px;background:color-mix(in srgb,var(--accent) 55%,#000)}
.scard .sf{border-radius:16px}
.scard .back{transform:translateZ(4px);background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.35),transparent 45%),radial-gradient(rgba(255,255,255,.16) 1.5px,transparent 2px) 0 0/12px 12px,linear-gradient(150deg,var(--accent),color-mix(in srgb,var(--accent) 62%,#000));box-shadow:inset 0 0 0 4px rgba(255,255,255,.2)}
.scard .back span{font-size:48px;text-shadow:0 3px 0 rgba(0,0,0,.25);color:#fff}
.scard .front{transform:rotateY(180deg) translateZ(4px);border:0;background:radial-gradient(circle at 50% 28%,var(--surface),var(--surface-2));box-shadow:inset 0 0 0 2px var(--line),inset 0 -8px 14px rgba(0,0,0,.08)}
.scard .front span{font-size:52px;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}
.scard.win .front{box-shadow:inset 0 0 0 3px var(--in),0 0 0 4px var(--in-soft),0 0 28px color-mix(in srgb,var(--in) 45%,transparent)}
.suit-mid{font-size:26px}

/* kartu gosok & tebak harga */
.scratch{box-shadow:0 6px 0 color-mix(in srgb,var(--k4) 50%,#000),0 16px 30px rgba(0,0,0,.18);margin-bottom:6px}
.scratch::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.35) 48%,transparent 60%);transform:translateX(-120%)}
.scratch.done::after{animation:sheen 1.4s .2s ease-out}
@keyframes sheen{to{transform:translateX(120%)}}
.gq{box-shadow:0 4px 0 var(--line),inset 0 1px 0 rgba(255,255,255,.5)}

/* tumpuk koin */
.stk-board{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stk-board div{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;min-width:0}
.stk-board span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stk-board div.on{border-color:var(--c);box-shadow:0 0 0 2px var(--c)}
.stk-board b{margin-left:auto;font-family:var(--display);font-size:20px}
.stk-wrap{position:relative;height:min(50vh,420px);min-height:300px;border-radius:22px;overflow:hidden;background:radial-gradient(120% 70% at 50% 100%,color-mix(in srgb,var(--k5) 16%,var(--surface)),var(--surface-2));box-shadow:inset 0 3px 14px rgba(0,0,0,.12);touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:pointer}
.stk-wrap canvas{position:absolute;inset:0;width:100%;height:100%}
.stk-hud{position:absolute;top:12px;left:0;right:0;text-align:center;pointer-events:none;padding:0 12px}
.stk-hud b{display:block;font-family:var(--display);font-size:46px;line-height:1}
.stk-hud small{font-weight:600;color:var(--muted);font-size:13.5px}
@media (prefers-reduced-motion:reduce){.cube{transition:none}}

/* Pengaturan page */
.pgh{display:flex;align-items:center;gap:6px;min-height:40px}
.pgh h1{font-size:24px}
.pgh .ib{margin-left:-8px}
.pgh .ib svg{width:22px;height:22px}
.sgrp{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:8px 4px -6px}
.slist{padding-top:4px;padding-bottom:4px}
.srow,.mecard{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;color:var(--ink);font:inherit}
.srow{background:none;border:0;border-top:1px solid var(--line);padding:12px 2px;min-height:56px}
.srow:first-child{border-top:0}
.srow .mono{width:34px;height:34px;border-radius:10px}
.srow .mono svg{width:18px;height:18px}
.st{display:flex;flex-direction:column;gap:2px;min-width:0}
.st b{font-size:15px;font-weight:600}
.st .hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chv{width:18px;height:18px;color:var(--muted);flex:none}
.srow:active,.mecard:active{transform:scale(.99)}
.mecard{cursor:pointer}
.mecard .st b{font-size:17px}
.rmonth{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rmonth .ib{background:var(--surface-2)}
.rmonth .ib svg{width:18px;height:18px}

/* Catat: tanggal */
.fdate{display:flex;flex-direction:column;gap:8px}
.fdbar{display:flex;align-items:center;gap:2px;background:var(--surface-2);border-radius:14px;padding:4px}
.fdbar .ib{width:40px;height:40px;flex:none;color:var(--ink);background:none}
.fdbar .ib svg{width:18px;height:18px}
.fdlbl{flex:1;display:flex;align-items:center;gap:10px;min-width:0;background:none;border:0;padding:4px 6px;color:var(--ink);font:inherit;text-align:left;border-radius:10px;min-height:44px}
.fdlbl svg{width:20px;height:20px;color:var(--accent);flex:none}
.fdlbl span{display:flex;flex-direction:column;min-width:0}
.fdlbl b{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fdlbl small{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fdtoday{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:0 12px;height:36px;font:inherit;font-size:13.5px;font-weight:600;margin-left:2px}
.fdtoday[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cal{border:1px solid var(--line);border-radius:14px;padding:8px 8px 10px;background:var(--surface)}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.calh b{font-size:15px}
.calh .ib{width:40px;height:40px;background:none;color:var(--ink)}
.calh .ib svg{width:18px;height:18px}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.calw{font-size:12px;color:var(--muted);padding:4px 0;font-weight:600}
.calw.sun,.cald.sun{color:var(--out)}
.cald{height:40px;width:40px;max-width:100%;justify-self:center;border:0;background:none;border-radius:999px;font:inherit;font-size:14.5px;color:var(--ink);font-variant-numeric:tabular-nums;padding:0}
.cald.today{box-shadow:inset 0 0 0 1.5px var(--accent);font-weight:700}
.cald[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:none}
.chip.addc{border-style:dashed;color:var(--accent);background:none}
.chip.addc .ci{color:var(--accent)}

/* Ringkasan dashboard */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--ink);font:inherit;min-width:0;box-shadow:0 1px 2px color-mix(in srgb,var(--ink) 5%,transparent)}
.kpi.wide{grid-column:1/-1}
.kpi:active{transform:scale(.98)}
.kpi .kh{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600;min-width:0}
.kpi .kh .mono{width:28px;height:28px;border-radius:9px;flex:none}
.kpi .kh .mono svg{width:15px;height:15px}
.kpi .kv{font-size:20px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.kpi .ks{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;min-width:0}
.kpi .ks>span:last-child{overflow:hidden;text-overflow:ellipsis}
.kpi .ks .pill{flex:none}
.kpi .track{display:block;height:6px;margin:2px 0}
.kpi .track .fill{display:block;height:100%}
.kpi .kv small{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0}
.delta{flex:none;font-weight:700;border-radius:999px;padding:1px 7px;font-size:11.5px}
.delta.good{background:var(--in-soft);color:var(--in)}
.delta.bad{background:var(--out-soft);color:var(--out)}
.delta.flat{background:var(--surface-2);color:var(--muted)}

.hsum{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 2px 8px;font-size:13px;color:var(--muted)}
.hsum .link{font-size:13px;padding:0}
.kpis.hk{display:flex;overflow-x:auto;gap:10px;margin:0 -16px 4px;padding:2px 16px 6px;scroll-snap-type:x mandatory;scroll-padding:0 16px;scrollbar-width:none;overscroll-behavior-x:contain}
.kpis.hk::-webkit-scrollbar{display:none}
.kpis.hk .kpi{flex:0 0 142px;scroll-snap-align:start;padding:10px 12px;gap:4px}
.kpis.hk .kpi.wide{flex-basis:230px}
.kpis.hk .kpi .kv{font-size:18px}
#hcards:empty{display:none}
/* keep the page tall enough that changing tab or filter never pulls the toolbar up */
#hlist{min-height:72vh}
.kpi[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.kpi .kv small{white-space:nowrap}

/* bottom nav: active tab gets a filled pill behind its icon, bolder label */
.nav button:not(.plus)>svg{width:56px;height:30px;padding:4px 17px;border-radius:999px;box-sizing:border-box;transition:background-color .2s,color .2s}
.nav button[aria-current="page"]{color:var(--accent);font-weight:800}
.nav button[aria-current="page"]:not(.plus)>svg{transform:none;background:var(--accent);color:var(--accent-ink)}
.nav .plus[aria-current="page"] span{outline:3px solid color-mix(in srgb,var(--accent) 35%,transparent);outline-offset:2px}
.nav .badge{top:0;left:calc(50% + 10px)}

/* Riwayat filters: compact dropdown grid + removable active pills */
.filters{gap:8px}
.filters .hq{min-height:40px;padding-top:8px;padding-bottom:8px;font-size:15px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.hact{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hact:empty{display:none}
.apill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px 0 11px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:12.5px;font-weight:700;max-width:100%}
.apill>span:not(.dot){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apill .dot{width:7px;height:7px;margin:0;box-shadow:0 0 0 1.5px var(--accent-ink)}
.apx{width:14px;height:14px;flex:none;opacity:.85}
.apall{font-size:12.5px;padding:0 4px}
/* Transaction rows: description beside the amount, details on their own line across the full width,
   both allowed to wrap so nothing gets cut. */
.tx{grid-template-areas:"m b a" "m s s";row-gap:2px;align-items:start}
.tx>.mono{grid-area:m;margin-top:1px}
.tx .d{display:contents}
.tx .d b{grid-area:b;white-space:normal;overflow:hidden;text-overflow:clip;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow-wrap:anywhere;line-height:1.3;align-self:center}
.tx .d small{grid-area:s;white-space:normal;line-height:1.45}
.tx .d small b{display:inline;-webkit-line-clamp:none}
.tx .a{grid-area:a;align-self:center}
.forline .av{margin-left:4px}

/* our dropdown + date field */
.dd{display:block;min-width:0}
.ddbtn{display:flex;align-items:center;gap:8px;text-align:left;cursor:pointer;color:var(--ink);font:inherit;font-size:16px}
.ddbtn .ddv{flex:1;min-width:0;display:flex;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ddbtn .ddv .dot{flex:none}
.ddc{width:18px;height:18px;flex:none;color:var(--muted);transition:transform .2s}
.ddbtn[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.ddbtn[aria-expanded="true"] .ddc{transform:rotate(180deg);color:var(--accent)}
.dd.sm .ddbtn{padding:8px 10px 8px 12px;font-size:13.5px;font-weight:600;border-radius:10px;min-height:38px}
.dd.sm .ddc{width:16px;height:16px}
#ddmenu{position:fixed;z-index:95;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;overflow:auto;overscroll-behavior:contain;box-shadow:0 14px 36px rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.06);animation:ddIn .16s cubic-bezier(.2,.8,.2,1);transform-origin:top center}
#ddmenu.up{transform-origin:bottom center}
#ddmenu[hidden]{display:none}
@keyframes ddIn{from{opacity:0;transform:translateY(-4px) scale(.98)}}
#ddmenu.up{animation-name:ddInUp}
@keyframes ddInUp{from{opacity:0;transform:translateY(4px) scale(.98)}}
.ddo{display:flex;align-items:center;width:100%;min-height:42px;padding:8px 10px;border:0;background:none;border-radius:10px;text-align:left;font:inherit;font-size:14.5px;color:var(--ink);gap:0}
.ddo .dot{margin-right:10px}
.ddo:hover,.ddo:focus-visible{background:var(--surface-2);outline:none}
.ddo[aria-selected="true"]{background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent);font-weight:700}
.ddk{width:18px;height:18px;margin-left:auto;flex:none;stroke-width:2.6}
.ddo .ddk{margin-left:auto}
.ddo>span.dot+*{flex:1}
.ddg{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px}
.dpf{position:relative;display:flex;flex-direction:column}
.dppop{position:absolute;top:calc(100% + 6px);left:0;z-index:6;width:min(320px,calc(100vw - 32px));box-shadow:0 14px 36px rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.06);animation:ddIn .16s cubic-bezier(.2,.8,.2,1)}
.dppop.r{left:auto;right:0}
.dpbtn .ddv{white-space:nowrap}
.dpbtn svg:first-child{width:18px;height:18px;color:var(--accent);flex:none}
.dpbtn .ph{color:var(--muted)}
.calf{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;padding:0 2px}
/* switches instead of device checkboxes */
.toggle input[type="checkbox"]{-webkit-appearance:none;appearance:none;width:46px;height:28px;border-radius:999px;background:color-mix(in srgb,var(--ink) 18%,var(--surface));position:relative;cursor:pointer;flex:none;transition:background .2s;margin:0}
.toggle input[type="checkbox"]::before{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s cubic-bezier(.3,1.3,.5,1)}
.toggle input[type="checkbox"]:checked{background:var(--accent)}
.toggle input[type="checkbox"]:checked::before{transform:translateX(18px)}
.toggle input[type="checkbox"]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* search: our own look, no device clear button */
input[type="search"]{-webkit-appearance:none;appearance:none}
input[type="search"]::-webkit-search-cancel-button,input[type="search"]::-webkit-search-decoration{-webkit-appearance:none;display:none}
details>summary{list-style:none;display:flex;align-items:center;gap:8px}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .2s;flex:none;margin-left:2px}
details[open]>summary::before{transform:rotate(45deg)}

/* Riwayat toolbar */
.hbar{display:flex;flex-direction:column;gap:10px}
.tseg{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:3px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.tseg button{display:flex;align-items:center;justify-content:center;gap:5px;height:34px;min-width:0;border:0;border-radius:999px;background:none;color:var(--muted);font:inherit;font-size:13px;font-weight:700;transition:background-color .2s,color .2s,box-shadow .2s}
.tseg button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tseg svg{width:15px;height:15px;flex:none}
.tseg button[aria-pressed="true"]{--tc:var(--accent);background:var(--tc);color:#fff;box-shadow:0 2px 8px color-mix(in srgb,var(--tc) 32%,transparent)}
.tseg .t-out[aria-pressed="true"]{--tc:var(--out)}
.tseg .t-in[aria-pressed="true"]{--tc:var(--in)}
.tseg .t-all[aria-pressed="true"],.tseg .t-tf[aria-pressed="true"]{color:var(--accent-ink)}
.hsearch{display:flex;align-items:center;gap:8px;height:40px;padding:0 5px 0 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:text;transition:border-color .15s,box-shadow .15s}
.hsearch:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.hsearch>svg{width:17px;height:17px;color:var(--muted);flex:none}
.hsearch input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;font:inherit;font-size:15px;color:var(--ink);padding:0}
.hsearch input::placeholder{color:var(--muted)}
.hsx{width:30px;height:30px;flex:none;border:0;border-radius:999px;background:var(--surface-2);color:var(--muted);display:grid;place-items:center}
.hsx svg{width:14px;height:14px}
.hsx[hidden]{display:none}
.fchips{display:flex;flex-wrap:nowrap;gap:6px;align-items:center;overflow-x:auto;margin:0 -16px;padding:2px 16px;scrollbar-width:none;overscroll-behavior-x:contain}
.fchips::-webkit-scrollbar{display:none}
.fchip,.freset{flex:none}
.fchip{display:inline-flex;align-items:center;height:30px;border-radius:999px;border:1px solid var(--line);background:var(--surface);max-width:100%;min-width:0;transition:background-color .15s,border-color .15s}
.fchip:has(.fcb[aria-expanded="true"]){border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.fcb{display:inline-flex;align-items:center;gap:3px;height:100%;padding:0 9px 0 11px;border:0;background:none;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);border-radius:999px;min-width:0}
.fcb .ddv{display:flex;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:150px}
.fcb .dot{width:7px;height:7px;margin:0 6px 0 0;flex:none}
.fcc{width:14px;height:14px;color:var(--muted);flex:none}
.fchip.on{background:var(--accent);border-color:var(--accent)}
.fchip.on .fcb{color:var(--accent-ink);font-weight:700;padding-right:4px}
.fchip.on .dot{box-shadow:none;background:var(--accent-ink)}

  (a||[]).forEach(d=>{if(!d||!d.t||!d.c)return;const k=catKey(d),o=m[k];if(!o||(d.u||0)>(o.u||0)){m[k]=d;ahead=true;}});
  return {list:Object.keys(m).map(k=>m[k]),ahead};
}
/* Move catatan out of deleted categories. Every phone does this itself after a delete, a merge,
   and at start, so the catatan don't need re-pushing (and don't show up as fresh activity). */
function remapCats(){
  let n=0;
  catDefs().forEach(d=>{if(!d.del||d.c==='lain')return;const to=CATS[d.t].some(c=>c.id===d.to)?d.to:'lain';
    S.tx.forEach(t=>{if(t.cat!==d.c||ctype(t)!==d.t)return;t.cat=to;n++;});});
  return n;
}

function feats(text){
  const f=[];String(text||'').toLowerCase().replace(/[^a-z\s]/g,' ').split(/\s+/).forEach(t=>{if(t.length<2||STOP[t])return;f.push(t);if(t.length>=5)f.push('p:'+t.slice(0,4));});
  return f;
}
let MODEL;
function buildModel(){
  MODEL={};
  ['out','in','bout','bin'].forEach(type=>{
    const counts={},totals={},vocab={};let V=0;
    CATS[type].forEach(c=>{counts[c.id]={};totals[c.id]=0;});
    const add=(c,fs,w)=>{if(!counts[c])return;fs.forEach(f=>{counts[c][f]=(counts[c][f]||0)+w;totals[c]+=w;if(!vocab[f]){vocab[f]=1;V++;}});};
    Object.keys(SEED[type]).forEach(c=>SEED[type][c].split(' ').forEach(w=>add(c,feats(w),1)));
    /* a deleted built-in category hands its seed words to the category its catatan moved to */
    catDefs().forEach(d=>{if(d.t===type&&d.del&&d.to&&SEED[type][d.c]&&counts[d.to])SEED[type][d.c].split(' ').forEach(w=>add(d.to,feats(w),1));});
    /* the family's own keywords count more than the built-in ones */
    CATS[type].forEach(c=>{if(c.w)String(c.w).toLowerCase().split(/[\s,;]+/).forEach(w=>{if(w)add(c.id,feats(w),3);});});
    const L=S.learned[type]||{};Object.keys(L).forEach(c=>Object.keys(L[c]).forEach(f=>add(c,[f],L[c][f]*3)));
    MODEL[type]={counts,totals,vocab,V};

}
function predict(type,text){
  if(type==='tf')return {best:null,conf:0,ranked:[]};
  const md=MODEL[type],fs=feats(text).filter(f=>md.vocab[f]);
  if(!fs.length)return {best:'lain',conf:0,ranked:[]};
  const a=.05,sc=CATS[type].map(c=>{let s=0;const t=md.totals[c.id];fs.forEach(f=>{s+=Math.log(((md.counts[c.id][f]||0)+a)/(t+a*md.V));});return {id:c.id,s};});
  const mx=Math.max(...sc.map(x=>x.s));let sum=0;sc.forEach(x=>{x.p=Math.exp(x.s-mx);sum+=x.p;});sc.forEach(x=>x.p/=sum);
  sc.sort((x,y)=>y.p-x.p);return {best:sc[0].id,conf:sc[0].p,ranked:sc.slice(0,3)};
}
function learn(type,text,c,p){

  const seen={},fs=feats(text).filter(f=>seen[f]?false:(seen[f]=1));

function parseAmount(str){
  const re=/(\d+(?:[.,]\d+)*)\s*(rb|ribu|k|jt|juta)?(?![a-z0-9])/gi;let m,best=null;
  while((m=re.exec(str))){
    const raw=m[1],suf=(m[2]||'').toLowerCase();let val;
    if(suf){const mult=(suf==='jt'||suf==='juta')?1e6:1e3;val=/^\d+[.,]\d{1,2}$/.test(raw)?parseFloat(raw.replace(',','.'))*mult:parseInt(raw.replace(/[.,]/g,''),10)*mult;}
    else{val=/^\d+,\d{1,2}$/.test(raw)?parseInt(raw,10):parseInt(raw.replace(/[.,]/g,''),10);if(val>0&&val<1000)val*=1000;}
    const score=(suf?2:0)+(val>=1000?1:0);
    if(!best||score>best.score||(score===best.score&&val>best.val))best={val:Math.round(val),score,start:m.index,len:m[0].length};
  }

}

const shopKey=n=>String(n||'').toLowerCase().replace(/\d+([.,]\d+)?\s*(rb|ribu|k|jt|juta)\b/g,'').replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim();
function shopPrice(n){const p=(S.shopPrice||{})[shopKey(n)];return p||0;}
/* "telur 1 kg 28rb, minyak dan gula" → three items, the first with a price */
function shopParse(txt){
  return String(txt||'').split(/\r?\n/).map(l=>l.replace(LIST_BUL,'')).join('\n').split(/\s*(?:,|;|\n|\bdan\b|\bsama\b|\bserta\b|\bplus\b)\s*/i).map(s=>s.trim()).filter(Boolean).map(s=>{
    /* only a real price counts: 18rb, 1,5jt, Rp 7.500, 12000. "2 liter" or "1 kg" is a quantity. */
    s=normSpeech(s);const a=parseAmount(s),tok=a?s.slice(a.start,a.start+a.len).trim():'',hasMoney=!!a&&(/(rb|ribu|k|jt|juta)$/i.test(tok)||tok.replace(/\D/g,'').length>=4||/rp\.?\s*$/i.test(s.slice(0,a.start)));
    let n=s;if(hasMoney&&a.val>=500){n=(s.slice(0,a.start)+' '+s.slice(a.start+a.len)).replace(/\brp\.?/i,'').replace(/\s+/g,' ').trim();}
    return {n:n.charAt(0).toUpperCase()+n.slice(1),price:hasMoney&&a.val>=500?a.val:0};}).filter(x=>x.n);
}
function shopAdd(txt){const L=shopParse(txt);L.forEach(x=>xPut({id:'s'+uid(),t:'shop',n:x.n,price:x.price||shopPrice(x.n)||0,done:false,by:S.me}));return L.length;}

function pocketForCat(ty,c){try{return (S.catPocket[ty]||{})[c]||defaultPocket(ty,c);}catch(e){const p=activePockets()[0];return p&&p.id;}}
function shopSave(){
  const amt=amountFromField(document.getElementById('shamt').value),er=document.getElementById('sherr');
  if(!(amt>0)){er.textContent='Isi total belanjanya dulu.';er.hidden=false;return;}
  const done=X('shop').filter(i=>i.done),now=Date.now(),desc=document.getElementById('shdesc').value.trim()||'Belanja';

  done.forEach(i=>{S.deleted[i.id]=now;});S.x=S.x.filter(r=>!done.includes(r));
  const cn=cat('out',UI.shc).n;save();sndSave();closeSheet();UI.shc=null;UI.shpk=null;render();toast('Tersimpan '+fmt(amt)+' · '+cn);

function weekSummary(thisWeek){
  const t=parseISO(todayISO()),dow=(t.getDay()+6)%7,mon=new Date(t);mon.setDate(t.getDate()-dow-(thisWeek||dow===6?0:7));
  const s=iso(mon),e=addDay(s,6),ps=addDay(s,-7),pe=addDay(s,-1),inR=(x,a,b)=>x.date>=a&&x.date<=b&&x.type==='out'&&!isUsahaTx(x);
  const cur={},prev={};let tc=0,tp=0;V().forEach(x=>{if(inR(x,s,e)){tc+=x.amount;cur[x.cat]=(cur[x.cat]||0)+x.amount;}else if(inR(x,ps,pe)){tp+=x.amount;prev[x.cat]=(prev[x.cat]||0)+x.amount;}});
  let up=null;Object.keys(cur).forEach(c=>{const d=cur[c]-(prev[c]||0);if(d>0&&(!up||d>up.d))up={c,d,p:prev[c]?Math.round(d/prev[c]*100):null};});
  return {s,e,tc,tp,up,top:Object.keys(cur).sort((a,b)=>cur[b]-cur[a])[0]};
}

/* ---------- Cek catatan: duplicate hints and a story-style quick review ----------
   Duplicates: same type and amount, dates at most a day apart, plus one more sign (same category,
   similar wording, recorded by both partners, or saved within minutes of each other). Pairs the
   user calls "bukan dobel" are remembered in settings.dupOk so they never come back on either phone.
   Review: catatan from the last 14 days without t.rv, newest first, one per slide. */
const DUP_DAYS=45,REV_DAYS=14,REV_MAX=20;
const dupKey=(a,b)=>a<b?a+'|'+b:b+'|'+a;
const dupWords=s=>String(s||'').toLowerCase().replace(/\d+([.,]\d+)*\s*(rb|ribu|k|jt|juta)?/g,' ').split(/[^a-z]+/).filter(w=>w.length>2);
function dupSim(a,b){const A=dupWords(a),B=dupWords(b);if(!A.length||!B.length)return 0;const s=new Set(A);return A.length&&B.filter(w=>s.has(w)).length/Math.max(A.length,B.length);}
function dupWhy(a,b){
  if(a.type!==b.type||a.amount!==b.amount)return '';
  if(Math.abs(parseISO(a.date)-parseISO(b.date))>864e5)return '';
  if(a.type==='tf'&&(a.pocket!==b.pocket||a.to!==b.to))return '';
  const quick=Math.abs((a.ts||0)-(b.ts||0))<15*6e4;
  if(a.amount<10000&&!quick)return '';                   // two parking or coffee payments a day are normal
  if(!SOLO()&&a.by&&b.by&&a.by!==b.by)return 'dicatat '+memName(a.by)+' dan '+memName(b.by);
  if(quick)return 'disimpan berdekatan';
  if(a.type!=='tf'&&a.cat===b.cat)return 'kategori sama';
  if(dupSim(a.desc,b.desc)>=.5)return 'keterangan mirip';
  return '';
}
let _dk=-1,_dg=[];
function dupGroups(){
  if(_dk===SV)return _dg;_dk=SV;
  const ok=new Set((S.settings&&S.settings.dupOk)||[]),from=addDay(todayISO(),-DUP_DAYS),B={};
  V().forEach(t=>{if(t.sample||t.type==='loan'||t.date<from)return;(B[t.type+'|'+t.amount]=B[t.type+'|'+t.amount]||[]).push(t);});
  const G=[];
  Object.values(B).forEach(L=>{if(L.length<2)return;L.sort((a,b)=>a.date.localeCompare(b.date)||a.ts-b.ts);
    const used=new Set();
    L.forEach((a,i)=>{if(used.has(a.id))return;const g=[a];let why='';
      for(let j=i+1;j<L.length;j++){const b=L[j];if(used.has(b.id))continue;if(g.some(x=>ok.has(dupKey(x.id,b.id))))continue;const w=dupWhy(a,b);if(w){g.push(b);why=why||w;}}
      if(g.length>1){g.forEach(x=>used.add(x.id));G.push({ids:g.map(x=>x.id),why});}});});
  _dg=G.sort((a,b)=>b.ids.length-a.ids.length);return _dg;
}
const dupIds=()=>{const s=new Set();dupGroups().forEach(g=>g.ids.forEach(i=>s.add(i)));return s;};
function revQueue(){
  const from=addDay(todayISO(),-REV_DAYS),D=dupIds();
  return sortTx(V().filter(t=>!t.rv&&!t.sample&&t.type!=='loan'&&t.date>=from&&t.date<=todayISO()&&!D.has(t.id)));
}
function cekCard(){
  if(!modOn('cek')||MODE())return '';const d=dupGroups().length,q=revQueue().length;
  if(!d&&q<3)return '';
  const parts=[];if(q)parts.push(q+' catatan belum dicek');if(d)parts.push(d+' mungkin tercatat dua kali');
  return '<button class="cekcard'+(d?' has-dup':'')+'" data-act="story"><span class="cek-rings" aria-hidden="true"><i></i><i></i><i></i></span><span class="cek-b"><b>Cek catatan</b><small>'+parts.join(' · ')+'</small></span><span class="cek-go">Mulai'+ic('chev')+'</span></button>';
}

/* Story overlay. Slides: duplicate groups first, then single catatan, then a finish slide. */
let ST=null;
function storyOpen(){
  const dup=dupGroups().map(g=>({k:'dup',ids:g.ids.slice(),why:g.why})),one=revQueue().slice(0,REV_MAX).map(t=>({k:'one',id:t.id}));
  if(!dup.length&&!one.length){toast('Semua catatan sudah dicek');return;}
  ST={i:0,slides:dup.concat(one),left:Math.max(0,revQueue().length-REV_MAX),done:{ok:0,fix:0,del:0,dup:0}};ST.slides.push({k:'end'});
  let el=document.getElementById('story');if(!el){el=document.createElement('div');el.id='story';el.className='story';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label','Cek catatan');document.body.appendChild(el);storySwipe(el);}
  el.hidden=false;document.documentElement.classList.add('story-on');sndOpen();storyPaint(0);

function stApply(id,k,v){
  const t=stTx(id);if(!t)return;const ty=ctype(t);
  if(k==='cat'){if(t.cat===v)return;if(!t.sample){unlearn(t.type,t.desc,t.cat);learn(t.type,t.desc,v,t.pocket);}t.cat=v;}
  else if(k==='pocket'){if(t.pocket===v)return;t.pocket=v;if(t.type!=='tf'&&!t.sample){S.catPocket[ty]=S.catPocket[ty]||{};S.catPocket[ty][t.cat]=v;}}
  else if(k==='to'){if(t.to===v)return;t.to=v;}
  else if(k==='date'){if(!v||t.date===v)return;t.date=v;}
  else if(k==='for'){if((t.for||'_')===v)return;if(v==='_')delete t.for;else t.for=v;}
  else if(k==='desc'){v=String(v||'').trim();if(!v||v===t.desc)return;if(t.type!=='tf'&&!t.sample){unlearn(t.type,t.desc,t.cat);learn(t.type,v,t.cat,t.pocket);}t.desc=v;}
  else if(k==='amt'){if(!(v>0)||v===t.amount)return;t.amount=v;}
  t.u=Date.now();t.eby=S.me;ST.fixed=ST.fixed||new Set();ST.fixed.add(t.id);save();buildModel();
  try{navigator.vibrate&&navigator.vibrate(8);}catch(e){}
}

function storySwipe(el){
  let x0=null,y0=0;

function storyAct(a,v){
  if(a==='story'){storyOpen();return true;}
  if(!ST)return false;
  if(a==='stclose'){storyClose();return true;}
  if(a==='stnext'){storyNext();return true;}
  if(a==='stprev'){storyGo(-1);return true;}
  /* our calendar redraws itself before its change event, so the story takes the picked day here */
  if(a.indexOf('dpp:st-date:')===0){const t=ST.slides[ST.i]&&stTx(ST.slides[ST.i].id),d=a.slice(12);if(DP['st-date'])DP['st-date'].open=false;if(t&&d)stApply(t.id,'date',d);ST.ed=null;storyPaint(0);return true;}
  if(a.indexOf('sted:')===0){ST.ed=ST.ed===v?null:(v||null);storyPaint(0);const f=document.querySelector('#st-desc,#st-amt');if(f){f.focus();const n=f.value.length;try{f.setSelectionRange(n,n);}catch(e){}}return true;}
  if(a.indexOf('stset:')===0){const t=ST.slides[ST.i]&&stTx(ST.slides[ST.i].id);if(!t)return true;const [k,val]=v.split('|');stApply(t.id,k,val);if(k!=='cat')ST.ed=null;storyPaint(0);return true;}
  if(a.indexOf('stsave:')===0){const t=ST.slides[ST.i]&&stTx(ST.slides[ST.i].id),f=document.getElementById(v==='amt'?'st-amt':'st-desc');if(!t||!f)return true;stApply(t.id,v,v==='amt'?amountFromField(f.value):f.value);ST.ed=null;storyPaint(0);return true;}
  if(a.indexOf('stok:')===0){const t=stTx(v);if(t)stMark(t,ST.fixed&&ST.fixed.has(t.id)?'fix':'ok');try{navigator.vibrate&&navigator.vibrate(10);}catch(e){}storyNext();return true;}
  if(a.indexOf('stedit:')===0){const t=stTx(v);if(!t)return true;stMark(t,'fix');storyNext();openTx(t.id);return true;}
  if(a.indexOf('stdel:')===0||a.indexOf('stdupdel:')===0){const t=stTx(v);if(!t)return true;const i=S.tx.indexOf(t);S.tx.splice(i,1);S.deleted[t.id]=Date.now();
    const dup=a.indexOf('stdupdel:')===0;ST.done[dup?'dup':'del']++;save();
    toast('Catatan dihapus','Urungkan',()=>{S.tx.splice(Math.min(i,S.tx.length),0,t);delete S.deleted[t.id];t.u=Date.now();ST&&(ST.done[dup?'dup':'del']--);save();if(ST)storyPaint(0);render();});
    if(dup){const s=ST.slides[ST.i];if(s.ids.map(stTx).filter(Boolean).length<2){storyNext();return true;}storyPaint(0);}else storyNext();
    return true;}
  if(a==='stdupok'){const s=ST.slides[ST.i],ok=(S.settings.dupOk||[]).slice();
    for(let i=0;i<s.ids.length;i++)for(let j=i+1;j<s.ids.length;j++)ok.push(dupKey(s.ids[i],s.ids[j]));
    S.settings.dupOk=ok.slice(-300);s.ids.map(stTx).filter(Boolean).forEach(t=>{t.rv=Date.now();t.u=Date.now();});touchSet();storyNext();return true;}
  return false;
}

/* ---------- Aktivitas: a log of every change to catatan, and notices of changes by the other person ----------
   Every save() compares catatan with the last snapshot and writes what changed (catat, ubah, hapus) as a
   synced record in S.x {t:'log'}. Records are written by the phone where the change happened, so changes
   that arrive by sync are never logged twice. Hidden gifts are not logged until they are revealed,
   because their contents never leave the giver's phone. Records older than 90 days are dropped. */
/* var and function declarations: save() can run while the app is still starting, before this part of the script */
var LOG_DAYS=90,LOGSNAP=null,LOG_TOASTED=0;
function logSig(t){return [t.type,t.amount,t.desc,t.cat,t.pocket,t.to||'',t.date,t.for||''].join('\u0001');}
function logShown(t){return !!t&&!t.sample&&!t.hidden&&!t.sealed;}
function logSnap(){LOGSNAP=new Map();S.tx.forEach(t=>{if(logShown(t))LOGSNAP.set(t.id,{s:logSig(t),t:logPick(t)});});}
function logPick(t){return {type:t.type,amount:t.amount,desc:t.desc||'',cat:t.cat||'',pocket:t.pocket||'',to:t.to||'',date:t.date,for:t.for||'',by:t.by||''};}
function logDiff(){
  if(!LOGSNAP){logSnap();return;}
  const now=Date.now(),seen=new Set(),E=[];
  S.tx.forEach(t=>{if(!logShown(t))return;seen.add(t.id);const old=LOGSNAP.get(t.id);
    if(!old){E.push({op:'add',tid:t.id,snap:logPick(t)});return;}
    if(old.s===logSig(t))return;const n=logPick(t),ch={};['type','amount','desc','cat','pocket','to','date','for'].forEach(k=>{if(old.t[k]!==n[k])ch[k]=[old.t[k],n[k]];});E.push({op:'edit',tid:t.id,snap:n,ch});});
  LOGSNAP.forEach((v,id)=>{if(!seen.has(id)&&S.deleted[id])E.push({op:'del',tid:id,snap:v.t});});
  if(E.length){S.x=S.x||[];
    if(E.length>20)S.x.push({id:'l'+uid(),t:'log',op:'bulk',n:E.length,adds:E.filter(e=>e.op==='add').length,dels:E.filter(e=>e.op==='del').length,at:now,by:S.me,u:now});
    else E.forEach((e,i)=>S.x.push(Object.assign({id:'l'+uid(),t:'log',at:now+i,by:S.me,u:now},e)));}
  const old=now-LOG_DAYS*864e5;S.x=(S.x||[]).filter(r=>r.t!=='log'||(r.at||0)>=old);
  logSnap();
}
const logList=()=>(S.x||[]).filter(r=>r.t==='log'&&!(S.deleted[r.id])).sort((a,b)=>b.at-a.at);
const logFromOthers=()=>SOLO()?[]:logList().filter(r=>r.by&&r.by!==S.me&&r.at>(S.logSeen||0));
const logWho=r=>r.by===S.me?'Kamu':memName(r.by);
function logLine(r){
  if(r.op==='bulk')return logWho(r)+' mengubah '+r.n+' catatan sekaligus'+(r.dels?' ('+r.dels+' dihapus)':'');
  const s=r.snap||{},what=s.desc||(s.type==='tf'?'Pindah saldo':cat(s.type==='in'?'in':'out',s.cat).n);
  if(r.op==='add')return logWho(r)+' mencatat '+what+' '+fmtS(s.amount);
  if(r.op==='del')return logWho(r)+' menghapus '+what+' '+fmtS(s.amount);
  return logWho(r)+' mengubah '+what;
}
const LOG_F={amount:'Nominal',desc:'Keterangan',cat:'Kategori',pocket:'Kantong',to:'Ke kantong',date:'Tanggal',type:'Jenis',for:'Untuk'};
function logVal(k,v,s){
  if(v===''||v==null)return '—';
  if(k==='amount')return fmt(v);if(k==='cat')return cat(s.type==='in'?'in':'out',v).n;if(k==='pocket'||k==='to')return pname(v);
  if(k==='date')return dayLabel(v);if(k==='type')return ({in:'Masuk',out:'Keluar',tf:'Pindah'})[v]||v;if(k==='for')return person(v)?person(v).n:'—';return v;
}
/* Add then delete within a day: worth pointing out, it is how money "disappears" from a report. */
function logAddDel(r,L){if(r.op!=='del')return false;return L.some(x=>x.op==='add'&&x.tid===r.tid&&r.at-x.at<864e5);}
function logBody(){
  const L=logList(),others=logFromOthers().length;
  let h='<p class="hint" style="margin:2px 4px 10px">Semua catat, ubah, dan hapus dari kalian berdua selama 90 hari terakhir.</p>';
  if(!L.length)return h+'<div class="empty">'+ic('list')+'<p>Belum ada aktivitas. Setiap catatan yang dibuat, diubah, atau dihapus akan muncul di sini.</p></div>';
  let day='';h+='<section class="card"><div class="loglist">';
  L.slice(0,300).forEach(r=>{const d=new Date(r.at),ds=d.toISOString().slice(0,10);
    if(ds!==day){day=ds;h+='<div class="logday">'+esc(dayLabel(todayISOof(d)))+'</div>';}
    const tx=S.tx.find(t=>t.id===r.tid),fresh=r.by!==S.me&&r.at>(S.logSeen||0),ad=logAddDel(r,L);
    h+='<div class="logrow op-'+r.op+(fresh?' fresh':'')+'"'+(tx&&!masked(tx)?' data-act="open:'+r.tid+'" role="button" tabindex="0"':'')+'><span class="logic">'+ic(r.op==='add'?'plus':r.op==='del'?'del':r.op==='bulk'?'list':'edit')+'</span><span class="logb"><b>'+esc(logLine(r))+'</b>'+
      (r.op==='edit'&&r.ch?'<small>'+Object.keys(r.ch).map(k=>LOG_F[k]+': '+esc(logVal(k,r.ch[k][0],r.snap))+' → '+esc(logVal(k,r.ch[k][1],r.snap))).join('<br>')+'</small>':'')+
      (ad?'<small class="logwarn">Dicatat lalu dihapus</small>':'')+'</span><span class="logt">'+d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})+'</span></div>';});
  h+='</div></section>';
  if(others){S.logSeen=Date.now();persist();logNative();}
  return h;
}
const todayISOof=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
/* Home notice and toast when the other person changed something */
function logCard(){
  const L=logFromOthers();if(!L.length||!modOn('aktivitas'))return '';
  const who=memName(L[0].by),sub=L.length===1?logLine(L[0]):L.slice(0,2).map(logLine).join(' · ')+(L.length>2?' · +'+(L.length-2)+' lagi':'');

function logNotify(){

/* Android: background check for the other person's changes while the app is closed (KasNative.activitySet). */
function logNative(){
  const N=window.KasQuickNative;if(!N||!N.activitySet)return;
  try{N.activitySet(JSON.stringify(modOn('aktivitas')&&S.family&&!SOLO()?{url:SB.url,key:SB.key,code:S.family.code,me:S.me,rev:S.family.rev||0,seen:S.logSeen||0,
    names:Object.fromEntries((S.members||[]).map(m=>[m.id,m.n])),lock:!!lsGet('kas.lock')}:{}));}catch(e){}
}
/* Catatan that arrive by sync without a log record (added from the watch, or from an older app):
   log them once, under a fixed id so both phones write the same record. */
function logSynced(added){
  if(!(S.family&&S.family.rev))return;const have=new Set(logList().filter(r=>r.op==='add').map(r=>r.tid)),old=Date.now()-3*864e5;
  added.forEach(t=>{if(!logShown(t)||have.has(t.id)||(t.ts||0)<old)return;S.x=S.x||[];if(S.x.some(r=>r.id==='la'+t.id))return;
    S.x.push({id:'la'+t.id,t:'log',op:'add',tid:t.id,snap:logPick(t),at:t.ts||Date.now(),by:t.by||'',u:t.ts||Date.now()});});
}

function glow(state){

/* ---------- Voice input: own listening sheet; native recognizer in the app, Web Speech in browsers ---------- */
const VO={on:false,final:false,text:'',eng:null};
function webSpeech(R){let r=null;return {start(){r=new R();r.lang='id-ID';r.interimResults=true;r.maxAlternatives=5;r.continuous=false;
    r.onstart=()=>voiceEvent({type:'ready'});
    r.onresult=e=>{const res=e.results[e.results.length-1],alts=[];for(let i=0;i<res.length;i++)alts.push(res[i].transcript);voiceEvent(res.isFinal?{type:'final',alts}:{type:'partial',text:alts[0]});};
    r.onerror=e=>voiceEvent({type:'error',code:e.error==='not-allowed'||e.error==='service-not-allowed'?'perm':e.error==='no-speech'?'nomatch':e.error==='network'?'network':e.error==='language-not-supported'?'lang':'other'});
    r.onend=()=>{if(VO.on&&!VO.final)voiceEvent({type:'error',code:'nomatch'});};
    r.start();},stop(){try{r&&r.stop();}catch(e){}},cancel(){try{r&&r.abort();}catch(e){}}};}
function voiceEngine(){
  const N=window.KasQuickNative;
  if(N&&N.voiceStart){let ok=true;try{ok=N.voiceAvailable();}catch(e){}if(ok)return {start:()=>N.voiceStart('id-ID'),stop:()=>N.voiceStop(),cancel:()=>N.voiceCancel()};}
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  return R?webSpeech(R):null;
}
function hasVoice(){try{return !!voiceEngine();}catch(e){return false;}}
window.__kasVoice=function(ev){try{voiceEvent(typeof ev==='string'?JSON.parse(ev):ev);}catch(e){}};
/* Speech often says "lima belas ribu": turn Indonesian number words into digits for parseAmount. */
function normSpeech(str){
  const U={satu:1,dua:2,tiga:3,empat:4,lima:5,enam:6,tujuh:7,delapan:8,sembilan:9};
  const w=String(str||'').toLowerCase().replace(/\brp\.?\s*(?=\d)/g,' ').split(/\s+/).filter(Boolean),out=[];
  let tot=0,cur=0,last=0,any=false;
  const flush=()=>{if(any)out.push(String(tot+cur+last));tot=cur=last=0;any=false;};
  w.forEach(x=>{
    if(U[x]){if(last)cur+=last;last=U[x];any=true;}
    else if(x==='sepuluh'){cur+=10;any=true;}else if(x==='sebelas'){cur+=11;any=true;}else if(x==='seratus'){cur+=100;any=true;}
    else if(x==='seribu'){tot+=1000;any=true;}else if(x==='sejuta'){tot+=1e6;any=true;}
    else if(x==='belas'&&last){cur+=last+10;last=0;}else if(x==='puluh'&&last){cur+=last*10;last=0;}else if(x==='ratus'&&last){cur+=last*100;last=0;}
    else if((x==='ribu'||x==='juta')&&any){tot+=(cur+last||1)*(x==='ribu'?1000:1e6);cur=last=0;}
    else{flush();out.push(x);}
  });flush();return out.join(' ');
}
function voiceStart(){
  const eng=voiceEngine();if(!eng){toast('Input suara belum tersedia di perangkat ini');return;}
  const d=document.getElementById('fdesc');if(d)d.blur();
  VO.eng=eng;VO.on=true;VO.final=false;VO.text='';voiceShow('wait');glow('on');
  sndOpen();
  setTimeout(()=>{if(!VO.on||VO.eng!==eng)return;try{eng.start();}catch(e){voiceEvent({type:'error',code:'other'});}},sndPref().open!=='off'?380:0);
}
function voiceClose(){VO.on=false;const o=document.getElementById('vo');if(o)o.remove();glowRest();setTimeout(nqWatch,0);}
function voiceShow(st,code){
  let o=document.getElementById('vo');if(!o){o=document.createElement('div');o.id='vo';document.body.appendChild(o);}
  o.className='vo '+st;
  const msg={wait:'Siap mendengarkan…',listen:'Mendengarkan…',think:'Memproses…',err:'Belum berhasil'}[st];
  const em={perm:'Izinkan mikrofon untuk Muarakas, lalu ketuk mikrofon lagi.',nomatch:'Belum terdengar. Ketuk mikrofon untuk coba lagi.',network:'Butuh internet untuk mengenali suara.',
    lang:'Bahasa Indonesia belum tersedia di pengenal suara HP ini.',busy:'Mikrofon sedang dipakai aplikasi lain.',unavailable:'HP ini belum punya layanan pengenal suara.',other:'Suara belum bisa dikenali. Coba lagi.'}[code]||'Suara belum bisa dikenali. Coba lagi.';
  const err=st==='err';
  o.innerHTML='<div class="vo-scrim" data-act="vcancel"></div>'+(err?'':glowHTML(st==='listen'?'listen':''))+'<div class="vo-card" role="dialog" aria-modal="true" aria-label="Catat dengan suara"><div class="vo-state">'+msg+'</div>'+
    '<div class="vo-mic"><span class="vo-wave"></span><span class="vo-ring"></span><button data-act="'+(err?'vretry':'vstop')+'" aria-label="'+(err?'Coba lagi':'Selesai bicara')+'">'+ic(err?'retry':'mic')+'</button></div>'+
    '<div class="vo-text'+(err||!VO.text?' ph':'')+'" id="vo-text">'+esc(err?em:VO.text||'Sebutkan, misal “bakso lima belas ribu”')+'</div><div class="vo-parse" id="vo-parse"></div>'+
    '<div class="vo-btns"><button class="btn ghost sm" data-act="vkbd">'+ic('kbd','ci')+'Ketik saja</button></div></div>';
  if(!err)voicePaint();
  nqWatch();

function voicePaint(){
  const t=document.getElementById('vo-text'),p=document.getElementById('vo-parse');if(!t||!p)return;
  if(VO.text){t.textContent=VO.text;t.classList.remove('ph');}
  const n=normSpeech(VO.text),a=parseAmount(n),rest=a?(n.slice(0,a.start)+' '+n.slice(a.start+a.len)).trim():n;
  const ty=F.type==='in'?'in':'out',ai=rest?predict(ty,rest):null;
  p.innerHTML=(a?fmt(a.val):'')+(ai&&ai.conf>0?'<span>'+esc(cat(ty,ai.best).n)+'</span>':'');
}
function voiceEvent(ev){
  if(!VO.on||!ev)return;
  if(ev.type==='ready'){voiceShow('listen');}
  else if(ev.type==='rms'){const lv=String(Math.max(0,Math.min(1,((+ev.level||0)+2)/12)));const o=document.getElementById('vo');if(o)o.style.setProperty('--lv',lv);glowLevel(lv);}
  else if(ev.type==='partial'){if(ev.text){VO.text=ev.text;voicePaint();}}
  else if(ev.type==='end'){if(!VO.final)voiceShow('think');glow('on');}
  else if(ev.type==='final'){VO.final=true;const alts=(ev.alts||[]).filter(Boolean);voiceApply(alts.find(x=>parseAmount(normSpeech(x)))||alts[0]||'');}
  else if(ev.type==='error'){voiceShow('err',ev.code);glow(QUICK?'on':'off');}
}
function voiceApply(text){
  voiceClose();if(!text)return;
  if(VO.target){const t=document.getElementById(VO.target);VO.target='';if(t){t.value=normSpeech(text);if(t.id==='shin'){const n=shopAdd(t.value);t.value='';render();toast(n+' barang ditambahkan');}}return;}
  if(!QUICK&&TAB!=='add'){TAB='add';F=newForm('out');render();}
  const d=document.getElementById('fdesc');if(!d)return;
  d.value=normSpeech(text);onDescInput();
  const nd=document.getElementById('fdesc');if(nd)nd.blur();
}

function rules(t){

  const base=t.hin+Math.max(0,t.bizNet||0);return {need,want,save:sav+Math.max(0,base-t.hout),base};
}
function ruleRow(label,v,inc,target,kind){

    '<div class="track"><div class="fill '+cls+'" style="width:'+Math.min(100,p)+'%"></div><span class="mark" style="left:calc('+target+'% - 1px)"></span></div></div>';
}

async function watchLink(btn){
  const inp=document.getElementById('watch-pin'),er=document.getElementById('watch-err'),pin=String(inp&&inp.value||'').replace(/\D/g,'');
  const fail=m=>{er.textContent=m;er.hidden=false;};er.hidden=true;
  if(pin.length!==6){fail('Kodenya 6 angka, lihat di layar jam.');return;}
  btn.disabled=true;
  try{
    if(!S.family){const code=genCode();await rpc('kas_create',{p_code:code});clearSamplesData();S.family={code,rev:0};S.srvU={};save();await syncNow();}
    const ok=await rpc('kas_watch_link',{p_pin:pin,p_code:S.family.code,p_me:S.me});
    if(ok){inp.value='';toast('Jam tersambung. Tunggu sebentar sampai jam selesai sinkron.');}
    else fail('Kode tidak cocok atau sudah kedaluwarsa. Buka lagi layar sambung di jam.');
  }catch(e){fail(/kas_watch_link|function|schema cache/i.test(String(e&&e.message))?'Server belum siap untuk jam. Untuk sementara, di jam pilih "Pakai kode keluarga".':'Tidak bisa terhubung ke server. Periksa internetmu lalu coba lagi.');}
  btn.disabled=false;
}

async function joinFamily(c){

  try{const r=await joinFamily(c);

  let det;try{det=await qrDetector();}catch(e){qrMsg('Pemindai belum termuat. Periksa internetmu, atau ketik kodenya.');return;}
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){qrMsg('Kamera tidak tersedia di sini. Pakai foto kode QR di bawah.');return;}
  try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
    if(!document.getElementById('qrv')||document.visibilityState!=='visible'){s.getTracks().forEach(t=>t.stop());return;}
    SCAN.stream=s;v.srcObject=s;await v.play();}
  catch(e){stopCam();qrMsg(e&&e.name==='NotAllowedError'?'Izin kamera ditolak. Izinkan kamera di pengaturan HP, atau pakai foto kode QR di bawah.':'Kamera tidak bisa dibuka. Pakai foto kode QR di bawah.');return;}
  const tick=async()=>{if(!SCAN.stream)return;
    if(!SCAN.busy&&v.readyState>=2){SCAN.busy=true;let t=null;try{t=await det(v);}catch(e){}SCAN.busy=false;if(t&&onScanText(t))return;}
    SCAN.t=setTimeout(tick,160);};
  tick();}
function stopCam(){clearTimeout(SCAN.t);if(SCAN.stream){SCAN.stream.getTracks().forEach(t=>t.stop());SCAN.stream=null;}SCAN.busy=false;const v=document.getElementById('qrv');if(v)v.srcObject=null;}
function onScanText(t){const c=parseInvite(t);if(!c){qrMsg('Ini bukan kode undangan Muarakas. Coba kode QR di Pengaturan → Undang.');return false;}
  stopCam();if(navigator.vibrate)navigator.vibrate(30);qrMsg('Kode terbaca. Menyambungkan…');
  joinAndReport(c).then(ok=>{if(!ok){qrMsg('Belum tersambung.');const b=document.getElementById('qr-again');if(b)b.hidden=false;}});return true;}
async function scanPhoto(f){qrMsg('Membaca foto…');let det;try{det=await qrDetector();}catch(e){qrMsg('Pemindai belum termuat. Periksa internetmu.');return;}
  const u=URL.createObjectURL(f),img=new Image();
  try{img.src=u;await img.decode();const t=await det(img,true);if(!t){qrMsg('Kode QR tidak terbaca. Foto lebih dekat, terang dan tidak buram.');return;}onScanText(t);}
  catch(e){qrMsg('Foto ini tidak bisa dibuka. Coba foto lain.');}finally{URL.revokeObjectURL(u);}}

/* secret amounts are encrypted on the owner's phone (PBKDF2 PIN -> AES-GCM) before they go online */
const b64=buf=>{let s='';new Uint8Array(buf).forEach(c=>s+=String.fromCharCode(c));return btoa(s);};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let SECKEY=null;
async function loadKey(){SECKEY=null;try{const r=localStorage.getItem('kas.seckey.'+S.me);if(r&&crypto.subtle)SECKEY=await crypto.subtle.importKey('raw',unb64(r),'AES-GCM',true,['encrypt','decrypt']);}catch(e){SECKEY=null;}}
async function deriveKey(pin,salt){const e=new TextEncoder(),base=await crypto.subtle.importKey('raw',e.encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:e.encode(salt),iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['encrypt','decrypt']);}
async function encStr(key,str){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(str));return b64(iv)+'.'+b64(ct);}
async function decStr(key,str){const p=str.split('.'),pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(p[0])},key,unb64(p[1]));return new TextDecoder().decode(pt);}
async function setPin(pin){
  const m=me();if(!m.salt){m.salt=uid()+uid();}const key=await deriveKey(pin,m.salt);
  if(m.pinCheck){let ok=false;try{ok=(await decStr(key,m.pinCheck))==='ok';}catch(e){}if(!ok)throw new Error('pin');}
  else{m.pinCheck=await encStr(key,'ok');m.u=Date.now();}
  SECKEY=key;try{localStorage.setItem('kas.seckey.'+S.me,b64(await crypto.subtle.exportKey('raw',key)));}catch(e){}
  save();await unlockOwnSealed();
}
async function unlockOwnSealed(){if(!SECKEY)return 0;let n=0;for(const t of S.tx){if(t.sealed&&t.enc&&t.by===S.me){try{const full=JSON.parse(await decStr(SECKEY,t.enc));Object.keys(t).forEach(k=>delete t[k]);Object.assign(t,full);n++;}catch(e){}}}if(n){save();render();}return n;}
function pinSheet(){const exists=!!me().pinCheck,intro=exists?'PIN ini membuka pemasukan rahasiamu di HP ini.':'PIN mengunci nominal pemasukan rahasiamu sebelum disimpan online. '+esc(partner().n)+' tidak bisa membukanya. Ingat baik-baik, PIN tidak bisa dipulihkan.';
  openSheet(sheetHead(exists?'Masukkan PIN rahasia':'Buat PIN rahasia')+'<div class="stack"><p class="small muted center" id="pin-msg">'+intro+(exists?'':' Pilih 4 sampai 8 angka.')+'</p>'+padHTML('pinpad',{c:'var(--k3)'})+'</div>');
  const msg=t=>{const m=document.getElementById('pin-msg');if(m)m.innerHTML=t;};let first='';
  padMount('pinpad',{len:exists?+lsGet('kas.pinlen.'+S.me)||0:0,go:exists?'Buka':'Lanjut',onDone:async v=>{
    if(!(window.crypto&&crypto.subtle)){padErr('pinpad','HP ini belum mendukung penguncian. Buka aplikasinya lewat https.');return false;}
    if(!exists&&!first){first=v;msg('Ketik PIN yang sama sekali lagi.');padSet('pinpad',{len:v.length});return true;}
    if(!exists&&v!==first){first='';msg(intro+' Pilih 4 sampai 8 angka.');padSet('pinpad',{len:0});padErr('pinpad','PIN kedua belum sama. Ulangi dari awal.');return false;}
    try{await setPin(v);}catch(e){padErr('pinpad','PIN salah. Coba lagi.');return false;}
    lsSet('kas.pinlen.'+S.me,String(v.length));closeSheet();render();toast('PIN aktif. Rahasiamu terkunci aman.');schedSync();return true;}});}
