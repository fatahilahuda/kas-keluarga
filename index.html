/* Sound: everything is synthesized with WebAudio, so no files to load and it works offline. */
const SFX=(()=>{let ctx=null,on=true,nb=null;try{on=localStorage.getItem('kas.sfx')!=='0';}catch(e){}
  const ac=()=>{if(!ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;try{ctx=new C();}catch(e){return null;}}if(ctx.state==='suspended')ctx.resume();return ctx;};
  const tone=(f,t0,d,type,vol,f2)=>{const c=ac();if(!c)return;const T=c.currentTime+t0,o=c.createOscillator(),g=c.createGain();o.type=type||'triangle';o.frequency.setValueAtTime(f,T);if(f2)o.frequency.exponentialRampToValueAtTime(f2,T+d);
    g.gain.setValueAtTime(.0001,T);g.gain.exponentialRampToValueAtTime(vol||.15,T+.012);g.gain.exponentialRampToValueAtTime(.0001,T+d);o.connect(g);g.connect(c.destination);o.start(T);o.stop(T+d+.05);};
  const noise=(t0,d,vol,freq,q,type)=>{const c=ac();if(!c)return;if(!nb){nb=c.createBuffer(1,c.sampleRate,c.sampleRate);const a=nb.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
    const T=c.currentTime+t0,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=nb;f.type=type||'bandpass';f.frequency.value=freq||2000;f.Q.value=q||1;
    g.gain.setValueAtTime(vol||.2,T);g.gain.exponentialRampToValueAtTime(.0001,T+d);s.connect(f);f.connect(g);g.connect(c.destination);s.start(T,Math.random()*.5);s.stop(T+d+.02);};
  const P={
    tick:()=>{tone(1700,0,.03,'square',.05);noise(0,.025,.1,3800,2);},
    pop:()=>tone(520,0,.12,'sine',.18,1040),
    lock:()=>{tone(880,0,.06,'square',.06);tone(1320,.06,.1,'square',.06);},
    roll:()=>{for(let i=0;i<8;i++)noise(i*.085,.05,.28,700+Math.random()*900,3);},
    flip:()=>{for(let i=0;i<10;i++)tone(2600+Math.random()*400,i*.17,.05,'sine',.06);},
    land:()=>{tone(2650,0,.5,'sine',.12);tone(3980,0,.35,'sine',.05);noise(0,.06,.15,3000,1);},
    scratch:()=>noise(0,.06,.09,5200,.7,'highpass'),
    clink:()=>{tone(2350+Math.random()*300,0,.22,'sine',.09);tone(3700,0,.14,'sine',.04);noise(0,.03,.08,4200,2);},
    fall:()=>{for(let i=0;i<6;i++){tone(2100-i*170,i*.07,.12,'sine',.07);noise(i*.07,.04,.08,3000,2);}},
    count:()=>tone(1200,0,.05,'square',.05),
    drum:d=>{const n=Math.round((d||1.2)/.05);for(let i=0;i<n;i++)noise(i*.05,.045,.06+.22*(i/n),180+120*(i/n),1.5,'lowpass');},
    win:()=>{[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,i*.1,.32,'triangle',.2));[1046.5,1318.5,1568,2093].forEach(f=>tone(f,.42,1.1,'sine',.07));
      tone(130.8,.42,.9,'triangle',.22);noise(.4,1.3,.18,7000,.6,'highpass');for(let i=0;i<8;i++)tone(2200+Math.random()*2600,.55+i*.08,.12,'sine',.045);},
    draw:()=>{tone(587,0,.18,'triangle',.18);tone(587,.22,.4,'triangle',.18);noise(.2,.5,.08,6000,.6,'highpass');},

  SFX.unlock();clearWin();UI.spinning=true;const btn=document.querySelector('[data-act="spin"]'),bulbs=document.getElementById('bulbs'),pin=document.querySelector('.wheel-pin');
  if(btn)btn.disabled=true;g.classList.remove('done');g.querySelectorAll('.win').forEach(x=>x.classList.remove('win'));if(bulbs){bulbs.classList.remove('party');bulbs.classList.add('fast');}
  const res=document.getElementById('wheel-res');res.textContent='Berputar…';res.classList.remove('pop');document.getElementById('wheel-act').innerHTML='';
  const from=UI.wrot||0,to=from+360*5+Math.random()*360,dur=RM?60:5600,t0=performance.now();let lastSeg=Math.floor(from/seg);
  const ease=t=>1-Math.pow(1-t,4);
  const frame=now=>{const t=Math.min(1,(now-t0)/dur),a=from+(to-from)*ease(t);g.style.transform='rotate('+a+'deg)';const s=Math.floor(a/seg);
    if(s!==lastSeg){lastSeg=s;SFX.play('tick');if(t>.55)buzz(6);if(pin&&!RM){pin.classList.remove('flick');void pin.getBoundingClientRect();pin.classList.add('flick');}}
    if(t<1)requestAnimationFrame(frame);else done();};
  const done=()=>{UI.spinning=false;UI.wrot=to;if(btn)btn.disabled=false;
    const a=((360-(to%360))%360),idx=Math.floor(a/seg)%n,pick=opts[idx];UI.wres=pick;
    const gg=document.getElementById('wheel-g');if(gg){gg.classList.add('done');const s=gg.querySelectorAll('.sg')[idx];if(s)s.classList.add('win');}
    const bl=document.getElementById('bulbs');if(bl){bl.classList.remove('fast');bl.classList.add('party');}
    const r=document.getElementById('wheel-res');if(r){r.textContent=pick;void r.offsetWidth;r.classList.add('pop');}
    const m=/Rp\s*(\d+)\s*rb/i.exec(pick),act=document.getElementById('wheel-act'),save=m?['Pindahkan '+fmtS(+m[1]*1000)+' ke tabungan','gsave:'+(+m[1]*1000)]:null;
    if(act)act.innerHTML=save?'<button class="btn" data-act="'+save[1]+'">'+save[0]+'</button>':'';
    const zonk=/^libur/i.test(pick);
    setTimeout(()=>celebrate({eyebrow:WHEEL_PRESETS[S.wheel.preset][0],title:pick,sub:zonk?'Hari ini dompet istirahat dulu.':'Roda sudah memutuskan. Nggak boleh protes!',
      tone:'var(--k'+(idx%7)+')',icon:zonk?GICON.sad:GICON.wheel,sound:zonk?'zonk':'win',actions:(save?[[save[0],save[1]]]:[]).concat([['Putar lagi','spin','ghost']])}),RM?0:650);
  };
  requestAnimationFrame(frame);
}

let STK=null;
const stkBest=()=>{try{return +localStorage.getItem('kas.stkbest')||0;}catch(e){return 0;}};
function stkBtnLabel(){const st=UI.stk,m=S.members;if(st.sc[0]!=null&&st.sc[1]!=null)return 'Main lagi';return 'Mulai: giliran '+esc(m[st.turn].n);}

    '<div class="stk-wrap" id="stk-wrap"><canvas id="stk-cv" aria-hidden="true"></canvas><div class="stk-hud" aria-live="polite"><b class="num" id="stk-n">0</b><small id="stk-msg">'+(b?'Rekor: '+b+' koin':'Siap menumpuk?')+'</small></div></div>'+
    '<button class="btn big" data-act="stkgo" id="stk-go">'+stkBtnLabel()+'</button>';

function initStack(){
  const cv=document.getElementById('stk-cv');if(!cv||cv.dataset.on)return;cv.dataset.on='1';
  const wrap=cv.parentNode,dpr=Math.min(2,window.devicePixelRatio||1),W=wrap.clientWidth,H=wrap.clientHeight,x=cv.getContext('2d');cv.width=W*dpr;cv.height=H*dpr;x.scale(dpr,dpr);
  const R=Math.min(W*.19,60);
  STK={cv,x,W,H,R,RY:R*.34,T:Math.max(8,Math.round(R*.17)),baseY:H-48,stack:[{x:0}],mov:null,drop:null,fall:[],fx:[],cam:0,camT:0,run:false,loop:false,last:0,phase:0};
  wrap.addEventListener('pointerdown',e=>{if(STK&&STK.run&&!STK.drop){e.preventDefault();stkDrop();}});
  stkDraw();
}
function stkStart(){
  const g=STK;if(!g)return;SFX.unlock();clearWin();Object.assign(g,{stack:[{x:0}],drop:null,fall:[],fx:[],cam:0,camT:0,run:true});UI.stacking=true;
  stkSpawn();const b=document.getElementById('stk-go');if(b){b.disabled=true;b.textContent='Ketuk arena untuk menjatuhkan';}
  document.getElementById('stk-n').textContent='0';document.getElementById('stk-msg').textContent='Giliran '+S.members[UI.stk.turn].n;stkLoop();
}
function stkSpawn(){const g=STK,n=g.stack.length;g.phase=Math.random()<.5?-Math.PI/2:Math.PI/2;g.mov={spd:Math.min(4.6,1.9+.11*(n-1))};}
function stkDrop(){const g=STK,top=g.stack.length;g.drop={x:stkMovX(),y:g.baseY-top*g.T-78,vy:0,ty:g.baseY-top*g.T};g.mov=null;buzz(8);}
const stkMovX=()=>(STK.W/2-STK.R-6)*Math.sin(STK.phase);
function stkLand(){
  const g=STK,d=g.drop,top=g.stack[g.stack.length-1],dx=d.x-top.x,msg=document.getElementById('stk-msg');g.drop=null;
  if(Math.abs(dx)>g.R*.92){g.fall.push({x:d.x,y:d.y,vx:Math.sign(dx)*110,vy:-60,rot:0,vr:Math.sign(dx)*3.2});stkOver('Meleset!');return;}
  let px=d.x;if(Math.abs(dx)<g.R*.09){px=top.x;g.fx.push({x:px,lv:g.stack.length,t:0});SFX.play('lock');buzz([10,30,10]);if(msg)msg.textContent='Pas!';}
  else{SFX.play('clink');buzz(12);if(msg)msg.textContent=Math.abs(dx)>g.R*.6?'Hampir jatuh…':'Lanjut!';}
  g.stack.push({x:px});
  /* A coin stays put only while the centre of mass of everything above it rests over the coin below. */
  for(let k=1;k<g.stack.length;k++){let s=0;for(let j=k;j<g.stack.length;j++)s+=g.stack[j].x;const com=s/(g.stack.length-k),under=g.stack[k-1].x;
    if(Math.abs(com-under)>g.R*.96){const dir=Math.sign(com-under);g.stack.slice(k).forEach((c,j)=>g.fall.push({x:c.x,y:g.baseY-(k+j)*g.T,vx:dir*(70+j*16),vy:-30,rot:0,vr:dir*(1.6+j*.25)}));g.stack.length=k;stkOver('Tumpukannya roboh!');return;}}
  document.getElementById('stk-n').textContent=g.stack.length-1;g.camT=Math.max(0,g.stack.length*g.T-g.H*.42);stkSpawn();
}
function stkOver(why){

function stkLoop(){const g=STK;if(!g||g.loop)return;g.loop=true;g.last=performance.now();
  const step=now=>{if(!STK||STK!==g||!g.cv.isConnected){g.loop=false;return;}const dt=Math.min(.04,(now-g.last)/1000);g.last=now;
    if(g.mov)g.phase+=g.mov.spd*dt;
    if(g.drop){g.drop.vy+=2600*dt;g.drop.y+=g.drop.vy*dt;if(g.drop.y>=g.drop.ty){g.drop.y=g.drop.ty;stkLand();}}
    g.fall.forEach(f=>{f.vy+=1500*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.rot+=f.vr*dt;});g.fall=g.fall.filter(f=>f.y+g.cam<g.H+120);
    g.fx.forEach(f=>f.t+=dt);g.fx=g.fx.filter(f=>f.t<.6);g.cam+=(g.camT-g.cam)*Math.min(1,dt*6);
    stkDraw();if(g.run||g.drop||g.fall.length||g.fx.length||Math.abs(g.camT-g.cam)>.5)requestAnimationFrame(step);else g.loop=false;};
  requestAnimationFrame(step);}
function stkCoin(x,cx,sy,R,RY,T,face){
  const sd=x.createLinearGradient(cx-R,0,cx+R,0);sd.addColorStop(0,'#6E4805');sd.addColorStop(.28,'#D3A02A');sd.addColorStop(.5,'#F7D774');sd.addColorStop(.74,'#C38E16');sd.addColorStop(1,'#6E4805');
  x.beginPath();x.moveTo(cx-R,sy);x.lineTo(cx-R,sy+T);x.ellipse(cx,sy+T,R,RY,0,Math.PI,0,true);x.lineTo(cx+R,sy);x.ellipse(cx,sy,R,RY,0,0,Math.PI,false);x.fillStyle=sd;x.fill();
  x.strokeStyle='rgba(90,58,0,.32)';x.lineWidth=1;x.beginPath();for(let k=1;k<12;k++){const px=cx-R+2*R*k/12,yy=sy+RY*Math.sqrt(Math.max(0,1-Math.pow((px-cx)/R,2)));x.moveTo(px,yy+1);x.lineTo(px,yy+T-1);}x.stroke();
  const tp=x.createRadialGradient(cx-R*.32,sy-RY*.5,R*.05,cx,sy,R*1.15);tp.addColorStop(0,'#FFF6CF');tp.addColorStop(.38,'#F2C94C');tp.addColorStop(.78,'#D9A21F');tp.addColorStop(1,'#A9740B');
  x.beginPath();x.ellipse(cx,sy,R,RY,0,0,Math.PI*2);x.fillStyle=tp;x.fill();x.strokeStyle='rgba(122,86,10,.5)';x.lineWidth=1.3;x.beginPath();x.ellipse(cx,sy,R*.8,RY*.8,0,0,Math.PI*2);x.stroke();
  if(face){x.save();x.translate(cx,sy);x.scale(1,RY/R);x.font='700 '+Math.round(R*.52)+'px "Bricolage Grotesque",system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';
    x.fillStyle='rgba(255,255,255,.45)';x.fillText('500',0,2);x.fillStyle='rgba(110,72,5,.72)';x.fillText('500',0,0);x.restore();}
}
function stkDraw(){
  const g=STK;if(!g)return;const {x,W,H,R,RY,T}=g,cx=W/2,cam=g.cam;x.clearRect(0,0,W,H);
  const fy=g.baseY+T+cam;if(fy<H+40){x.beginPath();x.ellipse(cx,fy+3,R*1.55,RY*1.5,0,0,Math.PI*2);x.fillStyle='rgba(0,0,0,.13)';x.fill();}
  const lo=Math.max(0,Math.floor((cam-(H-g.baseY)-T*4)/T));
  for(let i=lo;i<g.stack.length;i++){const sy=g.baseY-i*T+cam;if(sy>H+T)continue;stkCoin(x,cx+g.stack[i].x,sy,R,RY,T,i===g.stack.length-1);}
  g.fx.forEach(f=>{const sy=g.baseY-(f.lv)*T+cam,k=f.t/.6;x.beginPath();x.ellipse(cx+f.x,sy,R*(1+k*.7),RY*(1+k*.7),0,0,Math.PI*2);x.strokeStyle='rgba(255,214,90,'+(1-k)+')';x.lineWidth=3;x.stroke();});
  g.fall.forEach(f=>{x.save();x.translate(cx+f.x,f.y+cam+T/2);x.rotate(f.rot);stkCoin(x,0,-T/2,R,RY,T,false);x.restore();});
  const top=g.baseY-g.stack.length*g.T;
  if(g.mov){const sy=top-78+cam,mx=cx+stkMovX();x.beginPath();x.ellipse(mx,top+cam,R*.7,RY*.6,0,0,Math.PI*2);x.fillStyle='rgba(0,0,0,.08)';x.fill();stkCoin(x,mx,sy,R,RY,T,true);}
  if(g.drop)stkCoin(x,cx+g.drop.x,g.drop.y+cam,R,RY,T,true);
}

function invStats(b){let qty=b.qty0||0,inv=b.cost0||0;S.tx.forEach(t=>{if(t.biz!==b.id||masked(t))return;if(t.tfk==='beli'){qty+=t.qty||0;inv+=t.amount;}else if(t.tfk==='jual'){qty-=t.qty||0;inv-=t.amount;}});
  const price=curPrice(b),value=qty*price;return {qty,invested:inv,price,value,gain:price?value-inv:0,avg:qty>0?inv/qty:0,unit:b.unit||'gram'};}

let BIO_OK=false,BIO_BUSY=false;

async function bioProbe(){try{const n=natBio();if(n){const st=await n.status();return !!(st&&st.available);}

async function bioEnroll(){const n=natBio();

  try{const c=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:'Muarakas'},user:{id:unb64(uid),name:'Kunci Muarakas',displayName:'Kunci Muarakas'},

function buildTips(k){
  const out=[],isCur=k===mkey(todayISO()),dayN=isCur?new Date().getDate():dim(k),t=totals(k),pk=addMonth(k,-1),pt=totals(pk,isCur?dayN:0),pFull=totals(pk);
  if(!t.n)return [{level:'info',title:'Mulai dari mencatat',body:'Catat setiap pengeluaran sekecil apa pun selama 2 minggu. Dari situ AI bisa memberi saran yang sesuai kebiasaanmu.'}];
  const B=balances();
  if(isCur){bookAlerts().forEach(x=>out.push(x));cbudAlerts(t).forEach(x=>out.push(x));}
  activePockets().forEach(p=>{if(B[p.id]<0)out.push({level:'bad',title:'Saldo '+esc(p.n)+' minus',body:'Kurang '+fmt(-B[p.id])+'. Pindahkan saldo dari kantong lain, atau cek apakah ada pengeluaran yang salah kantong.'});});
  if(t.in<=0)out.push({level:'warn',title:'Pemasukan belum dicatat',body:'Ada pengeluaran '+fmt(t.out)+' tapi belum ada pemasukan di '+mname(k)+'. Catat gaji atau hasil usaha supaya keseimbangannya terlihat.'});
  else{
    const ratio=t.out/t.in;
    if(ratio>1)out.push({level:'bad',title:'Pengeluaran melebihi pemasukan',body:'Defisit '+fmt(t.out-t.in)+'. Tunda belanja keinginan dan cek kategori terbesar dulu sebelum menambah utang.'});
    else if(ratio>=.8)out.push({level:'warn',title:'Sisa uang menipis',body:pct(t.out,t.in)+'% pemasukan sudah terpakai. Sisa '+fmt(t.in-t.out)+(isCur?' untuk '+(dim(k)-dayN)+' hari lagi, kira-kira '+fmtS((t.in-t.out)/Math.max(1,dim(k)-dayN))+' per hari.':'.')});
    else out.push({level:'good',title:'Keseimbangan sehat',body:'Kamu baru memakai '+pct(t.out,t.in)+'% pemasukan. Pindahkan sebagian sisa '+fmt(t.in-t.out)+' ke kantong tabungan sebelum terpakai.'});
    const r=rules(t);
    if(!isCur&&r.base>0&&r.save/r.base<.1)out.push({level:'warn',title:'Tabungan di bawah 10%',body:'Biasakan bayar diri sendiri dulu: begitu gajian, langsung sisihkan 10–20%, misalnya '+fmt(Math.round(r.base*.1/1000)*1000)+' per bulan.'});
    if(r.base>0&&r.want/r.base>.3)out.push({level:'warn',title:'Belanja keinginan lebih dari 30%',body:'Jajan, hiburan, dan belanja pribadi mencapai '+pct(r.want,r.base)+'% pemasukan '+HOMEN().toLowerCase()+'. Turun ke 30% bisa menghemat sekitar '+fmt(Math.round((r.want-r.base*.3)/1000)*1000)+'.'});
    activeUsaha().forEach(b=>{const i=t.bi[b.id]||0,o=t.bo[b.id]||0;if(i||o){if(o>i)out.push({level:'warn',title:'Usaha '+esc(b.n)+' rugi '+fmtS(o-i),body:'Omzet '+fmtS(i)+', biaya '+fmtS(o)+' bulan ini. Buka halaman usaha untuk melihat biaya terbesarnya.'});}});
    const cic=t.cats.cicilan||0;if(cic/t.in>.3)out.push({level:'bad',title:'Cicilan terlalu berat',body:'Cicilan '+pct(cic,t.in)+'% dari pemasukan. Batas aman di bawah 30%. Hindari cicilan atau paylater baru dulu.'});
    activePockets().forEach(p=>{if(p.save)return;const i=t.ip[p.id]||0,o=t.op[p.id]||0;if(i>0&&o>i*1.1&&o-i>100000)out.push({level:'warn',title:'Kantong '+esc(p.n)+' lebih banyak keluar',body:'Bulan ini keluar '+fmtS(o)+' padahal masuk '+fmtS(i)+'. Selisihnya diambil dari saldo lama kantong ini.'});});
  }
  const jj=inMonth(k).filter(x=>x.type==='out'&&x.cat==='jajan');
  if(jj.length>=8){const js=jj.reduce((a,b)=>a+b.amount,0);out.push({level:'warn',title:jj.length+' kali jajan bulan ini',body:'Totalnya '+fmt(js)+'. Pengeluaran kecil yang sering paling cepat menguras dompet. Kurangi separuhnya, hemat sekitar '+fmtS(js/2)+'.'});}
  sortedCats(t.cats).forEach(c=>{const prev=pt.cats[c.id]||0;if(prev>0&&c.v>prev*1.3&&c.v-prev>=Math.max(50000,t.out*.03))
    out.push({level:'warn',title:cat('out',c.id).n+' naik '+Math.round((c.v/prev-1)*100)+'%',body:'Dibanding '+mshort(pk)+(isCur?' pada tanggal yang sama':'')+': '+fmtS(prev)+' → '+fmtS(c.v)+'.'});});
  if(pt.out>0&&t.out<pt.out*.9)out.push({level:'good',title:'Lebih hemat dari '+mshort(pk),body:'Pengeluaran turun '+fmt(pt.out-t.out)+(isCur?' dibanding tanggal yang sama bulan lalu.':'.')});
  const Bd=S.settings.budget;
  if(Bd>0&&isCur){const pace=t.out/(Bd*dayN/dim(k));if(t.out>Bd)out.push({level:'bad',title:'Anggaran terlampaui',body:'Sudah '+fmt(t.out)+' dari anggaran '+fmt(Bd)+'.'});
    else if(pace>1.1)out.push({level:'warn',title:'Laju belanja lebih cepat dari anggaran',body:'Supaya cukup sampai akhir bulan, batasi '+fmtS((Bd-t.out)/(dim(k)-dayN+1))+' per hari.'});}
  const saveIds=S.pockets.filter(p=>p.save).map(p=>p.id),base=Math.max(pFull.out,t.out);
  const saved=S.tx.some(x=>(mkey(x.date)===k||mkey(x.date)===pk)&&((x.type==='out'&&x.cat==='tabungan')||(x.type==='tf'&&saveIds.indexOf(x.to)>=0)));
  if(!saved&&base)out.push({level:'info',title:'Siapkan dana darurat',body:'Belum ada uang masuk ke kantong tabungan dua bulan ini. Targetkan dana darurat 3–6 kali pengeluaran bulanan, sekitar '+fmtS(base*3)+' sampai '+fmtS(base*6)+'.'});
  else if(saveIds.length&&base){const sb=saveIds.reduce((a,id)=>a+(B[id]||0),0),mo=sb/base;
    out.push({level:mo>=3?'good':'info',title:'Tabungan setara '+mo.toLocaleString('id-ID',{maximumFractionDigits:1})+' bulan pengeluaran',body:mo>=6?'Dana darurat sudah aman. Sisanya bisa diarahkan ke tujuan jangka panjang.':'Target dana darurat 3–6 bulan, sekitar '+fmtS(base*3)+' sampai '+fmtS(base*6)+'.'+(mo<3?' Kurang '+fmtS(base*3-sb)+' untuk batas bawah.':'')});}
  const big=inMonth(k).filter(x=>x.type==='out').sort((a,b)=>b.amount-a.amount)[0];
  if(big)out.push({level:'info',title:'Pengeluaran terbesar',body:esc(big.desc)+' sebesar '+fmt(big.amount)+' ('+cat('out',big.cat).n+', dari kantong '+esc(pname(big.pocket))+').'});
  const rank={bad:0,warn:1,good:2,info:3};out.sort((a,b)=>rank[a.level]-rank[b.level]);
  return out;
}

/* ---------- back button / gesture ----------
   One step back per press: celebration, sheet, game, then the tab back to Beranda.
   On Beranda the first press only warns; a second press within a few seconds leaves.
   Android APK: the shim's backButton listener calls window.kasBack(). Browser and installed
   PWA: a single guard history entry turns each back press into a popstate. */
const EXIT_WINDOW=2800;let exitArmedUntil=0;
const IS_APK=/KasKeluargaAndroid/.test(navigator.userAgent)||!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
function backStep(){
  if(document.getElementById('onb')){if(ONB&&ONB.step>0){onbAct(['back']);return true;}return false;}
  if(document.getElementById('lockov'))return false;
  if(document.getElementById('celeb')){closeCeleb();return true;}
  if(DDOPEN){ddClose(true);return true;}
  if(perIsOpen()){perClose(true);return true;}
  if(!document.getElementById('sheet').hidden){closeSheet();return true;}
  if(TAB==='set'&&UI.st){UI.st=null;render(true);window.scrollTo(0,0);return true;}
  if(TAB==='set'){leaveSettings();return true;}
  if(UI.gfs){closeGame();return true;}
  if(TAB!=='home'){TAB='home';UI.bd=null;UI.bm=null;render(true);window.scrollTo(0,0);return true;}
  if(MODE()){PG='home';UI.bd=null;UI.bm=null;render(true);window.scrollTo(0,0);return true;}
  return false;
}
function warnExit(){exitArmedUntil=Date.now()+EXIT_WINDOW;toast('Tekan kembali sekali lagi untuk keluar');}
window.kasBack=function(){
  if(backStep()){exitArmedUntil=0;return true;}
  if(Date.now()<exitArmedUntil){exitArmedUntil=0;const t=document.getElementById('toast');if(t)t.hidden=true;return false;}
  warnExit();return true;
};
function armBackGuard(){if(IS_APK)return;try{if(!(history.state&&history.state.kasGuard))history.pushState({kasGuard:1},'');}catch(e){}}
window.addEventListener('popstate',()=>{
  if(IS_APK||(history.state&&history.state.kasGuard)||/gabung=/.test(location.hash))return;
  if(backStep()){exitArmedUntil=0;armBackGuard();return;}
  // Now on the page's own entry: the next back press leaves. Re-arm on the next tap.
  warnExit();
});
['pointerdown','keydown'].forEach(t=>document.addEventListener(t,()=>{if(Date.now()>=exitArmedUntil)armBackGuard();},true));
// APKs built before the shim knew about kasBack only close sheets and then minimise; route that through kasBack.
function hookOldShimBack(){
  if(window.__kasShimBack)return;
  const app=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
  if(!app||typeof app.minimizeApp!=='function'||app.minimizeApp.__kas)return;
  const minimize=app.minimizeApp;
  const f=function(){return window.kasBack()?Promise.resolve():minimize.apply(app,arguments);};f.__kas=1;
  try{app.minimizeApp=f;}catch(e){}
}
if(IS_APK){hookOldShimBack();document.addEventListener('DOMContentLoaded',hookOldShimBack);window.addEventListener('load',hookOldShimBack);}

   slides a spinner out from under the sticky header; releasing past the threshold syncs with the
   partner and refreshes gold prices, then the content springs back. Skipped on the Catat form,
   inside fields/canvases, and while any overlay is open. */

  const ptr=document.createElement('div');ptr.className='ptr';ptr.setAttribute('aria-hidden','true');
  // The Muarakas mark twice: a faint outline, and a full-colour copy clipped by a wave of "water".
  const WP=627,WA=38;let wd='M'+(21-2*WP)+' 0';for(let i=0;i<6;i++)wd+=' q'+WP/4+' '+(-WA)+' '+WP/2+' 0 t'+WP/2+' 0';wd+=' V1500 H'+(21-2*WP)+' Z';
  const shape=mkSvg('mark','mk-ptr').replace(/^<svg[^>]*>|<\/svg>$/g,'').replace(/<defs>.*?<\/defs>/,'');
  const grad=(mkSvg('mark','mk-ptr').match(/<defs>(.*?)<\/defs>/)||[])[1]||'';
  ptr.innerHTML='<div class="ptr-i"><svg class="mk" viewBox="21 23 1254 1282"><defs>'+grad+'<clipPath id="mk-ptr-c"><path class="ptr-wave" d="'+wd+'"/></clipPath></defs><g class="ptr-ghost">'+shape+'</g><g clip-path="url(#mk-ptr-c)">'+shape+'</g></svg></div>';
  top.after(ptr);
  const dot=ptr.firstChild,wave=dot.querySelector('.ptr-wave');
  const TH=64,HOLD=64,MAX=116;
  let y0=0,x0=0,d=0,track=false,pulling=false,busy=false;
  const blocked=t=>TAB==='add'||UI.gfs||document.getElementById('lockov')||document.getElementById('onb')||document.getElementById('celeb')||!document.getElementById('sheet').hidden||(t&&t.closest&&t.closest('canvas,input,textarea,select,[contenteditable],[data-noptr]'));
  function paint(v){
    d=v;view.style.transform=v>0.5?'translateY('+v.toFixed(1)+'px)':'';
    const p=Math.min(1,v/TH);ptr.classList.toggle('on',v>0.5||busy);
    dot.style.opacity=busy?1:Math.min(1,p*1.4);
    dot.style.transform='translateY('+(v/2-23).toFixed(1)+'px)';
    // Water level in logo units: empty below the mark (1343) to brimming over its top (94).
    wave.style.translate='0 '+(1343-p*1249).toFixed(0)+'px';
  }
  function settle(v,done){ptr.classList.add('back');view.classList.add('ptr-back');paint(v);
    setTimeout(()=>{ptr.classList.remove('back');view.classList.remove('ptr-back');if(done)done();},320);}
  async function run(){
    busy=true;ptr.classList.add('spin');settle(HOLD);
    if(navigator.vibrate)try{navigator.vibrate(8);}catch(e){}
    const t0=Date.now();
    try{await Promise.all([S.family?syncNow(true):null,fetchGold('ptr')]);}catch(e){}
    // Hold until a tide cycle (1.8s) completes, so the logo is brimming as it leaves.
    const el=Date.now()-t0,wait=Math.max(1,Math.ceil(el/1800))*1800-el;
    if(wait>0)await new Promise(r=>setTimeout(r,wait));
    if(blocked())return finish();
    render();if(!S.family)toast('Data diperbarui');
    finish();
  }
  function finish(){settle(0,()=>{busy=false;ptr.classList.remove('spin');paint(0);});}
  document.addEventListener('touchstart',e=>{
    track=false;pulling=false;
    if(busy||e.touches.length!==1||window.scrollY>0||blocked(e.target))return;
    track=true;y0=e.touches[0].clientY;x0=e.touches[0].clientX;
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!track||busy)return;
    const t=e.touches[0],dy=t.clientY-y0,dx=t.clientX-x0;
    if(!pulling){
      if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)){track=false;return;}
      if(dy<-6||window.scrollY>0){track=false;return;}
      if(dy<8)return;
      pulling=true;y0=t.clientY;
    }
    const pull=Math.max(0,t.clientY-y0);
    if(e.cancelable)e.preventDefault();
    paint(MAX*(1-Math.exp(-pull/150)));
  },{passive:false});
  const end=()=>{if(!pulling){track=false;return;}track=false;pulling=false;if(d>=TH)run();else settle(0);};
  document.addEventListener('touchend',end,{passive:true});
  document.addEventListener('touchcancel',end,{passive:true});
})();
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;});
if(QUICK){
  // Popup: no lock screen (it can only add, and hides balances when the app lock is on), no onboarding.
  try{const N=window.KasQuickNative;if(N&&N.navInset)document.documentElement.style.setProperty('--nb',(+N.navInset()||0)+'px');}catch(e){}
  sndPreload();render(true);loadKey().then(()=>{unlockOwnSealed();syncNow();});
  if(!needOnb())requestAnimationFrame(()=>glow('on'));
  if(QUICK==='voice'&&!needOnb())setTimeout(voiceStart,180);
  else if(!needOnb()){sndOpen();
    const P=new URLSearchParams(location.search),q=P.get('q');
    if(q){if(P.get('ty')==='in'){F=newForm('in',{typeManual:true});render(true);}setTimeout(()=>{const d=document.getElementById('fdesc');if(d){d.value=q;onDescInput();}},150);}
    else setTimeout(()=>{const d=document.getElementById('fdesc');if(d)d.focus();},150);}
}else{
render(true);
if(needOnb())openOnb();
showLock();bioProbe().then(v=>{BIO_OK=v;});
loadKey().then(()=>{unlockOwnSealed();syncNow();});
checkInviteHash();window.addEventListener('hashchange',checkInviteHash);
fetchGold();setInterval(()=>{if(document.visibilityState==='visible')fetchGold();},36e5);
setInterval(()=>{if(document.visibilityState==='visible')syncNow();},15000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;
  // A catatan saved from the widget popup while this page sat in the background: take it in.
  if(TAB==='set'&&UI.st==='notifbank')render();
  const f=foreignState();if(f){const before=S.tx.length;S=f;SEEN=f.wAt||0;logSnap();applyCats();remapCats();buildModel();render();const n=S.tx.length-before;if(n>0)toast(n+' catatan baru dari catat cepat');}
  syncNow();});
window.addEventListener('online',()=>syncNow());
widgetPush();
if(!needOnb())setTimeout(()=>{window.__kasShare();try{const N=window.KasQuickNative,t=N&&N.navTake?N.navTake():'';if(t)window.__kasNav(t);}catch(e){}},250);
/* A tap on the Android notification for the other person's changes opens Riwayat, where the catatan are. */
window.__kasNav=t=>{if(t==='log')t='hist';if(VIEWS[t]){closeSheet();if(ST)storyClose();TAB=t;render(true);window.scrollTo(0,0);}};
logNative();
}
window.__kas={parseReceipt,parseAmount,predict,merge,buildTips,balances,S:()=>S,save:()=>save(),exportObj,syncNow,SB,setPin};
})();
</script>
